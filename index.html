<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#151515">

  <title>あれこれ</title>

  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #151515;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Sans",
        "Yu Gothic",
        sans-serif;
    }

    body {
      overscroll-behavior: none;
    }


    /* ==============================
       READER
    ============================== */

    #reader {
      position: fixed;
      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #151515;
      overflow: hidden;

      user-select: none;
      -webkit-user-select: none;
    }


    #book {
      width: 100%;
      height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      padding:
        env(safe-area-inset-top)
        env(safe-area-inset-right)
        env(safe-area-inset-bottom)
        env(safe-area-inset-left);
    }


    #pages {
      width: 100%;
      height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 0;
    }


    .page {
      display: block;

      width: auto;
      height: auto;

      max-width: 100%;
      max-height: 100%;

      object-fit: contain;

      background: white;

      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
    }


    /* ==============================
       DESKTOP DOUBLE PAGE
    ============================== */

    @media (min-width: 900px) {

      #pages.two-pages .page {
        max-width: 50%;
        max-height: 100%;
      }

    }


    /* ==============================
       MOBILE SINGLE PAGE
    ============================== */

    @media (max-width: 899px) {

      #book {
        padding: 0;
      }

      .page {
        max-width: 100vw;
        max-height: 100dvh;
      }

    }


    /* ==============================
       INVISIBLE TAP AREAS
    ============================== */

    .tap-zone {
      position: fixed;
      top: 0;
      bottom: 0;

      z-index: 10;
    }


    #prevZone {
      left: 0;
      width: 30%;
    }


    #centerZone {
      left: 30%;
      width: 40%;
    }


    #nextZone {
      right: 0;
      width: 30%;
    }


    /* ==============================
       MINIMAL UI
    ============================== */

    #ui {
      position: fixed;

      left: 50%;
      bottom:
        calc(18px + env(safe-area-inset-bottom));

      transform: translateX(-50%);

      display: flex;
      align-items: center;
      gap: 14px;

      padding: 8px 14px;

      border-radius: 999px;

      background: rgba(20, 20, 20, 0.72);
      color: white;

      font-size: 13px;

      z-index: 30;

      opacity: 0;
      pointer-events: none;

      transition: opacity 180ms ease;

      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }


    #ui.visible {
      opacity: 1;
      pointer-events: auto;
    }


    .ui-button {
      appearance: none;

      border: 0;
      background: transparent;
      color: white;

      font-size: 22px;
      line-height: 1;

      padding: 4px 8px;

      cursor: pointer;
    }


    #pageIndicator {
      min-width: 78px;

      text-align: center;
      white-space: nowrap;

      font-variant-numeric: tabular-nums;
    }


    /* ==============================
       LOADING
    ============================== */

    #loading {
      position: fixed;
      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      color: rgba(255,255,255,.55);

      font-size: 12px;
      letter-spacing: .08em;

      pointer-events: none;

      z-index: 2;
    }


    #loading.hidden {
      display: none;
    }

  </style>
</head>


<body>


  <main id="reader">

    <div id="loading">
      loading…
    </div>

    <div id="book">
      <div id="pages"></div>
    </div>

  </main>


  <!-- Invisible navigation zones -->

  <div
    id="prevZone"
    class="tap-zone">
  </div>

  <div
    id="centerZone"
    class="tap-zone">
  </div>

  <div
    id="nextZone"
    class="tap-zone">
  </div>


  <!-- Minimal controls -->

  <div id="ui">

    <button
      id="prevButton"
      class="ui-button"
      aria-label="Previous page">
      ‹
    </button>

    <div id="pageIndicator">
      1 / 60
    </div>

    <button
      id="nextButton"
      class="ui-button"
      aria-label="Next page">
      ›
    </button>

  </div>



<script>

  /*
    ==========================================
    あれこれ
    Digital Edition
    First Edition · 2026
    ==========================================
  */


  const TOTAL_PAGES = 60;

  const DESKTOP_BREAKPOINT = 900;


  let currentPage = 1;

  let uiTimer = null;

  let touchStartX = 0;
  let touchStartY = 0;


  const pagesElement =
    document.getElementById("pages");

  const loadingElement =
    document.getElementById("loading");

  const uiElement =
    document.getElementById("ui");

  const indicatorElement =
    document.getElementById("pageIndicator");



  /* ==============================
     MODE
  ============================== */


  function isDoublePageMode() {

    return window.innerWidth >= DESKTOP_BREAKPOINT;

  }



  /* ==============================
     FILE NAMES
  ============================== */


  function pageFile(pageNumber) {

    return (
      String(pageNumber).padStart(2, "0")
      + ".jpg"
    );

  }



  /* ==============================
     SPREAD LOGIC

     Desktop:

     01
     02 + 03
     04 + 05
     ...
     58 + 59
     60

     Mobile:

     01
     02
     03
     ...
     60
  ============================== */


  function getVisiblePages() {


    /* MOBILE */

    if (!isDoublePageMode()) {

      return [currentPage];

    }


    /* COVER */

    if (currentPage <= 1) {

      return [1];

    }


    /* BACK COVER */

    if (currentPage >= TOTAL_PAGES) {

      return [TOTAL_PAGES];

    }


    /* DESKTOP SPREAD */

    let leftPage;


    if (currentPage % 2 === 0) {

      leftPage = currentPage;

    } else {

      leftPage = currentPage - 1;

    }


    const rightPage =
      leftPage + 1;


    if (rightPage >= TOTAL_PAGES) {

      return [TOTAL_PAGES];

    }


    return [
      leftPage,
      rightPage
    ];

  }



  /* ==============================
     CREATE IMAGE
  ============================== */


  function createPageImage(pageNumber) {

    const img =
      document.createElement("img");


    img.className =
      "page";


    img.src =
      pageFile(pageNumber);


    img.alt =
      "あれこれ " + pageNumber;


    img.draggable =
      false;


    return img;

  }



  /* ==============================
     RENDER
  ============================== */


  function render() {

    const visiblePages =
      getVisiblePages();


    pagesElement.innerHTML =
      "";


    pagesElement.classList.toggle(
      "two-pages",
      visiblePages.length === 2
    );


    visiblePages.forEach(
      pageNumber => {

        const img =
          createPageImage(pageNumber);

        pagesElement.appendChild(img);

      }
    );


    updateIndicator(
      visiblePages
    );


    preloadNearbyPages(
      visiblePages
    );


    loadingElement.classList.add(
      "hidden"
    );

  }



  /* ==============================
     INDICATOR
  ============================== */


  function updateIndicator(
    visiblePages
  ) {


    if (
      visiblePages.length === 1
    ) {

      indicatorElement.textContent =
        visiblePages[0]
        + " / "
        + TOTAL_PAGES;

    }

    else {

      indicatorElement.textContent =
        visiblePages[0]
        + "–"
        + visiblePages[1]
        + " / "
        + TOTAL_PAGES;

    }

  }



  /* ==============================
     NEXT
  ============================== */


  function nextPage() {


    if (
      currentPage >= TOTAL_PAGES
    ) {

      return;

    }


    /* MOBILE */

    if (!isDoublePageMode()) {

      currentPage++;

      render();

      return;

    }


    /* DESKTOP COVER → FIRST SPREAD */

    if (currentPage === 1) {

      currentPage = 2;

      render();

      return;

    }


    const visiblePages =
      getVisiblePages();


    const lastVisiblePage =
      visiblePages[
        visiblePages.length - 1
      ];


    if (
      lastVisiblePage >= 59
    ) {

      currentPage = 60;

    }

    else {

      currentPage =
        lastVisiblePage + 1;

    }


    render();

  }



  /* ==============================
     PREVIOUS
  ============================== */


  function previousPage() {


    if (
      currentPage <= 1
    ) {

      return;

    }


    /* MOBILE */

    if (!isDoublePageMode()) {

      currentPage--;

      render();

      return;

    }


    /* DESKTOP BACK COVER */

    if (
      currentPage === TOTAL_PAGES
    ) {

      currentPage = 58;

      render();

      return;

    }


    const visiblePages =
      getVisiblePages();


    const firstVisiblePage =
      visiblePages[0];


    if (
      firstVisiblePage <= 2
    ) {

      currentPage = 1;

    }

    else {

      currentPage =
        firstVisiblePage - 2;

    }


    render();

  }



  /* ==============================
     UI
  ============================== */


  function showUI() {


    uiElement.classList.add(
      "visible"
    );


    clearTimeout(
      uiTimer
    );


    uiTimer =
      setTimeout(
        () => {

          uiElement.classList.remove(
            "visible"
          );

        },
        2600
      );

  }



  function toggleUI() {


    if (
      uiElement.classList.contains(
        "visible"
      )
    ) {

      uiElement.classList.remove(
        "visible"
      );

      clearTimeout(
        uiTimer
      );

    }

    else {

      showUI();

    }

  }



  /* ==============================
     CLICK / TAP
  ============================== */


  document
    .getElementById("prevZone")
    .addEventListener(
      "click",
      previousPage
    );


  document
    .getElementById("nextZone")
    .addEventListener(
      "click",
      nextPage
    );


  document
    .getElementById("centerZone")
    .addEventListener(
      "click",
      toggleUI
    );



  document
    .getElementById("prevButton")
    .addEventListener(
      "click",
      event => {

        event.stopPropagation();

        previousPage();

        showUI();

      }
    );



  document
    .getElementById("nextButton")
    .addEventListener(
      "click",
      event => {

        event.stopPropagation();

        nextPage();

        showUI();

      }
    );



  /* ==============================
     KEYBOARD
  ============================== */


  document.addEventListener(
    "keydown",
    event => {


      if (
        event.key === "ArrowRight"
      ) {

        nextPage();

      }


      if (
        event.key === "ArrowLeft"
      ) {

        previousPage();

      }


      if (
        event.key === " "
      ) {

        event.preventDefault();

        toggleUI();

      }

    }
  );



  /* ==============================
     SWIPE
  ============================== */


  document.addEventListener(
    "touchstart",
    event => {


      if (
        event.touches.length !== 1
      ) {

        return;

      }


      touchStartX =
        event.touches[0].clientX;


      touchStartY =
        event.touches[0].clientY;

    },
    {
      passive: true
    }
  );



  document.addEventListener(
    "touchend",
    event => {


      if (
        event.changedTouches.length !== 1
      ) {

        return;

      }


      const touchEndX =
        event.changedTouches[0].clientX;


      const touchEndY =
        event.changedTouches[0].clientY;


      const deltaX =
        touchEndX - touchStartX;


      const deltaY =
        touchEndY - touchStartY;


      /*
        Ignore:
        - tiny movement
        - mostly vertical movement
      */

      if (
        Math.abs(deltaX) < 45
        ||
        Math.abs(deltaX)
        <
        Math.abs(deltaY)
      ) {

        return;

      }


      if (
        deltaX < 0
      ) {

        nextPage();

      }

      else {

        previousPage();

      }

    },
    {
      passive: true
    }
  );



  /* ==============================
     PRELOAD
  ============================== */


  function preloadPage(
    pageNumber
  ) {


    if (
      pageNumber < 1
      ||
      pageNumber > TOTAL_PAGES
    ) {

      return;

    }


    const img =
      new Image();


    img.src =
      pageFile(
        pageNumber
      );

  }



  function preloadNearbyPages(
    visiblePages
  ) {


    const first =
      visiblePages[0];


    const last =
      visiblePages[
        visiblePages.length - 1
      ];


    preloadPage(
      first - 2
    );


    preloadPage(
      first - 1
    );


    preloadPage(
      last + 1
    );


    preloadPage(
      last + 2
    );

  }



  /* ==============================
     RESIZE
  ============================== */


  let resizeTimer;


  window.addEventListener(
    "resize",
    () => {


      clearTimeout(
        resizeTimer
      );


      resizeTimer =
        setTimeout(
          () => {

            /*
              Normalize current page when
              switching between mobile
              and desktop.
            */

            if (
              isDoublePageMode()
              &&
              currentPage > 1
              &&
              currentPage < TOTAL_PAGES
              &&
              currentPage % 2 !== 0
            ) {

              currentPage--;

            }


            render();

          },
          120
        );

    }
  );



  /* ==============================
     START
  ============================== */


  render();

</script>

</body>
</html>
