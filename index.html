<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#151515">

  <title>あれこれ</title>

  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #151515;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Sans",
        "Yu Gothic",
        sans-serif;
    }

    body {
      overscroll-behavior: none;
      touch-action: manipulation;
    }


    /* ========================================
       READER
    ======================================== */

    #reader {
      position: fixed;
      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      background: #151515;

      user-select: none;
      -webkit-user-select: none;
    }


    #book {
      width: 100%;
      height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      padding:
        env(safe-area-inset-top)
        env(safe-area-inset-right)
        env(safe-area-inset-bottom)
        env(safe-area-inset-left);
    }


    #pages {
      width: 100%;
      height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 0;

      position: relative;
    }


    .page {
      display: block;

      width: auto;
      height: auto;

      max-width: 100%;
      max-height: 100%;

      object-fit: contain;

      background: #fff;

      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
    }


    /* ========================================
       DESKTOP DOUBLE PAGE
    ======================================== */

    @media (min-width: 900px) {

      /*
        Desktop: make the spread read as a physical open book.
        Keep the JPGs themselves untouched; all depth is CSS-only.
      */

      #book {
        padding: 2.5vh 0;
      }

      #pages {
        height: 95vh;
        width: 100%;
      }

      #pages.two-pages {
        gap: 0;
        isolation: isolate;
      }

      #pages.two-pages .page {
        max-width: 50%;
        max-height: 95vh;
        position: relative;
      }

      /*
        Outer paper edges: a light rim is visible against the black reader.
        This is deliberately not a black drop shadow.
      */

      /* Natural center fold: no divider line, no physical gap. */
      #pages.two-pages::before,
      #pages.two-pages::after { content: none !important; display: none !important; }

      #pages.two-pages .page:first-child {
        border-left: 5px solid rgb(239,236,229);
        box-shadow:
          -2px 0 0 rgba(210,210,202,0.28),
          -10px 0 22px rgba(255,255,248,0.10),
          inset -36px 0 16px -28px rgba(62,56,49,0.133);
      }

      #pages.two-pages .page:last-child {
        border-right: 5px solid rgb(239,236,229);
        box-shadow:
          2px 0 0 rgba(210,210,202,0.28),
          10px 0 22px rgba(255,255,248,0.10),
          inset 36px 0 16px -28px rgba(62,56,49,0.133);
      }

      /* Cover / back cover shown alone. */

      #pages:not(.two-pages) .page {
        max-height: 95vh;
        border-left: 2px solid rgba(255,255,248,0.66);
        border-right: 2px solid rgba(255,255,248,0.66);
        box-shadow:
          -2px 0 0 rgba(210,210,202,0.28),
          2px 0 0 rgba(210,210,202,0.28),
          -10px 0 22px rgba(255,255,248,0.10),
          10px 0 22px rgba(255,255,248,0.10);
      }

    }


    /* ========================================
       MOBILE SINGLE PAGE
    ======================================== */

    @media (max-width: 899px) {

      #book {
        padding: 0;
      }

      .page {
        max-width: 100vw;
        max-height: 100dvh;
      }

    }


    /* ========================================
       INVISIBLE NAVIGATION ZONES
    ======================================== */

    .tap-zone {
      position: fixed;

      top: 0;
      bottom: 0;

      z-index: 20;
    }


    #prevZone,
    #centerZone,
    #nextZone {
      width: auto;
    }



    /* ========================================
       LARGE SIDE ARROWS
    ======================================== */

    .side-arrow {
      position: fixed;

      top: 50%;

      transform: translateY(-50%);

      z-index: 15;

      display: flex;
      align-items: center;
      justify-content: center;

      width: 72px;
      height: 120px;

      color: rgba(255,255,255,0.82);

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size: 64px;
      font-weight: 200;
      line-height: 1;

      opacity: 0;

      pointer-events: none;

      transition:
        opacity 280ms ease,
        transform 280ms ease;

      text-shadow:
        0 1px 7px rgba(0,0,0,0.45);
    }


    #leftArrow {
      left:
        calc(12px + env(safe-area-inset-left));

      transform:
        translateY(-50%)
        translateX(-6px);
    }


    #rightArrow {
      right:
        calc(12px + env(safe-area-inset-right));

      transform:
        translateY(-50%)
        translateX(6px);
    }


    .side-arrow.visible {
      opacity: 0.62;
    }


    #leftArrow.visible {
      transform:
        translateY(-50%)
        translateX(0);
    }


    #rightArrow.visible {
      transform:
        translateY(-50%)
        translateX(0);
    }


    /* ========================================
       MOBILE ARROWS
    ======================================== */

    @media (max-width: 899px) {

      .side-arrow {
        width: 52px;
        height: 100px;

        font-size: 52px;

        color: rgba(255,255,255,0.9);
      }


      #leftArrow {
        left:
          calc(2px + env(safe-area-inset-left));
      }


      #rightArrow {
        right:
          calc(2px + env(safe-area-inset-right));
      }


      .side-arrow.visible {
        opacity: 0.52;
      }

    }


    /* ========================================
       PAGE INDICATOR
    ======================================== */

    #pageUI {
      position: fixed;

      left: 50%;

      bottom:
        calc(18px + env(safe-area-inset-bottom));

      transform:
        translateX(-50%)
        translateY(5px);

      z-index: 30;

      padding:
        7px 13px;

      border-radius: 999px;

      background:
        rgba(20,20,20,0.68);

      color:
        rgba(255,255,255,0.92);

      font-size: 12px;

      letter-spacing: 0.02em;

      white-space: nowrap;

      font-variant-numeric:
        tabular-nums;

      backdrop-filter:
        blur(8px);

      -webkit-backdrop-filter:
        blur(8px);

      opacity: 0;

      pointer-events: none;

      transition:
        opacity 220ms ease,
        transform 220ms ease;
    }


    #pageUI.visible {
      opacity: 1;

      transform:
        translateX(-50%)
        translateY(0);
    }




    /* ========================================
       AUDIOBOOK V1 · P4 / P5
    ======================================== */

    #audioUI {
      position: fixed;
      left: 0;
      right: 0;
      bottom: calc(58px + env(safe-area-inset-bottom));
      z-index: 31;
      pointer-events: none;
      opacity: 0;
      transition: opacity 220ms ease;
    }

    #audioUI.visible { opacity: 1; }

    .audio-button {
      position: fixed;
      bottom: calc(58px + env(safe-area-inset-bottom));
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 50%;
      background: rgba(20,20,20,0.68);
      color: rgba(255,255,255,0.94);
      font-size: 15px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      cursor: pointer;
      pointer-events: auto;
      display: none;
    }

    #audioLeft { left: calc(50% - 72px); }
    #audioRight { left: calc(50% + 30px); }

    @media (max-width: 899px) {
      #audioLeft,
      #audioRight {
        left: 50%;
        transform: translateX(-50%);
      }
    }


    /* ========================================
       BACK TO COVER
    ======================================== */

    #backToCover {
      position: fixed;
      left: 50%;
      bottom: calc(24px + env(safe-area-inset-bottom));
      transform: translateX(-50%) translateY(4px);
      z-index: 32;
      padding: 8px 14px;
      border: 0;
      border-radius: 999px;
      background: rgba(20,20,20,0.58);
      color: rgba(255,255,255,0.90);
      font: inherit;
      font-size: 12px;
      letter-spacing: 0.02em;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 220ms ease, transform 220ms ease, background 180ms ease;
    }

    #backToCover.visible {
      opacity: 0.78;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }

    #backToCover:hover,
    #backToCover:focus-visible {
      opacity: 1;
      background: rgba(20,20,20,0.76);
      outline: none;
    }


    /* ========================================
       LOADING
    ======================================== */

    #loading {
      position: fixed;
      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      color:
        rgba(255,255,255,0.45);

      font-size: 11px;

      letter-spacing: 0.08em;

      pointer-events: none;

      z-index: 2;
    }


    #loading.hidden {
      display: none;
    }
</style>
</head>


<body>


  <main id="reader">

    <div id="loading">
      loading…
    </div>

    <div id="book">
      <div id="pages"></div>
    </div>

  </main>


  <!-- Invisible navigation -->

  <div
    id="prevZone"
    class="tap-zone">
  </div>

  <div
    id="centerZone"
    class="tap-zone">
  </div>

  <div
    id="nextZone"
    class="tap-zone">
  </div>


  <!-- Large navigation hints -->

  <div
    id="leftArrow"
    class="side-arrow"
    aria-hidden="true">
    ‹
  </div>

  <div
    id="rightArrow"
    class="side-arrow"
    aria-hidden="true">
    ›
  </div>


  <!-- Page number -->

  <div id="pageUI">
    <span id="pageIndicator">
      1 / 60
    </span>
  </div>


  <!-- Audiobook controls -->

  <div id="audioUI">
    <button id="audioLeft" class="audio-button" type="button" aria-label="朗読を再生">▶</button>
    <button id="audioRight" class="audio-button" type="button" aria-label="朗読を再生">▶</button>
  </div>



  <!-- Back cover: return to front cover -->
  <button id="backToCover" type="button" aria-label="表紙に戻る">
    ↶ 表紙に戻る
  </button>


<script>

  /*
    ==========================================
    あれこれ
    Digital Edition
    First Edition · 2026
    ==========================================
  */


  const TOTAL_PAGES = 60;

  const DESKTOP_BREAKPOINT = 900;

  const HINT_DURATION = 2600;

  const TTS_ENDPOINT =
    "https://japanese-reset-tts-prototype-842886308739.asia-northeast1.run.app";

  const AUDIOBOOK_PAGES = {
    4: {
      lines: [
        "ニールくん、昨日何時に寝た？",
        "8時！",
        "えー！早い！",
        "毎日8時ごろ寝るよ。",
        "じゃあ、朝は何時に起きるの？",
        "6時！",
        "学校の前に朝ごはんを食べるよ。",
        "早っ！",
        "哲也くん、日曜日BFA行く？",
        "うん、行くよ！",
        "何時からだっけ？",
        "えーっと……何時だっけ？",
        "うん。ママに聞く！",
        "ぼくもママに聞いてみる！",
        "じゃあ、日曜日に！",
        "うん！楽しみ！"
      ]
    },
    5: {
      lines: [
        "ちょっとドキドキする……",
        "こっちで合ってる。",
        "次だ！",
        "ママ！",
        "一人で帰れたよ！",
        "おかえり！",
        "あれ？ママ、まだかな。",
        "もしもし、ママ？今、駅に着いたよ。",
        "ごめん！あとちょっと！",
        "あ、ここにいる。",
        "ママ！",
        "はるかー！"
      ]
    }
  };



  let currentPage = 1;

  let hintTimer = null;

  let touchStartX = 0;
  let touchStartY = 0;

  let activeAudio = null;
  let activeAudioPage = null;
  let activeAudioButton = null;
  const audioCache = new Map();



  const pagesElement =
    document.getElementById("pages");

  const loadingElement =
    document.getElementById("loading");

  const pageUI =
    document.getElementById("pageUI");

  const indicatorElement =
    document.getElementById("pageIndicator");

  const leftArrow =
    document.getElementById("leftArrow");

  const rightArrow =
    document.getElementById("rightArrow");

  const prevZone =
    document.getElementById("prevZone");

  const centerZone =
    document.getElementById("centerZone");

  const nextZone =
    document.getElementById("nextZone");

  const audioUI =
    document.getElementById("audioUI");

  const audioLeft =
    document.getElementById("audioLeft");

  const audioRight =
    document.getElementById("audioRight");

  const backToCover =
    document.getElementById("backToCover");




  /* ========================================
     MODE
  ======================================== */


  function isDesktop() {

    return (
      window.innerWidth
      >=
      DESKTOP_BREAKPOINT
    );

  }



  /* ========================================
     FILE NAMES
  ======================================== */


  function pageFile(pageNumber) {

    return (
      String(pageNumber)
        .padStart(2, "0")
      +
      ".jpg"
    );

  }





  /* ========================================
     AUDIOBOOK TTS
  ======================================== */

  function audiobookText(pageNumber) {
    const page = AUDIOBOOK_PAGES[pageNumber];
    return page ? page.lines.join("\n") : null;
  }

  async function fetchPageAudio(pageNumber) {
    if (audioCache.has(pageNumber)) {
      return audioCache.get(pageNumber);
    }

    const text = audiobookText(pageNumber);
    if (!text) throw new Error("No audiobook text for this page.");

    const response = await fetch(TTS_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        passageId: "arekore-p" + String(pageNumber).padStart(2, "0"),
        clips: [{ clipId: "full", kind: "full", text }]
      })
    });

    if (!response.ok) {
      throw new Error("TTS request failed: " + response.status);
    }

    const data = await response.json();
    if (!data.clips || !data.clips.length) {
      throw new Error("No audio returned.");
    }

    const clip = data.clips[0];
    const base64 = clip.audioBase64 || clip.audio || clip.base64;
    if (!base64) throw new Error("Audio data missing.");

    const mimeType = data.mimeType || clip.mimeType || "audio/mpeg";
    const audioURL = "data:" + mimeType + ";base64," + base64;
    audioCache.set(pageNumber, audioURL);
    return audioURL;
  }

  function resetAudioButton() {
    if (activeAudioButton) activeAudioButton.textContent = "▶";
  }

  function stopAudio() {
    if (activeAudio) {
      activeAudio.pause();
      activeAudio.currentTime = 0;
    }
    resetAudioButton();
    activeAudio = null;
    activeAudioPage = null;
    activeAudioButton = null;
  }

  async function togglePageAudio(pageNumber, button) {
    if (activeAudio && activeAudioPage === pageNumber) {
      if (!activeAudio.paused) {
        activeAudio.pause();
        button.textContent = "▶";
        return;
      }
      await activeAudio.play();
      button.textContent = "Ⅱ";
      return;
    }

    stopAudio();
    button.textContent = "…";

    try {
      const audioURL = await fetchPageAudio(pageNumber);
      const audio = new Audio(audioURL);
      activeAudio = audio;
      activeAudioPage = pageNumber;
      activeAudioButton = button;

      audio.addEventListener("ended", () => {
        button.textContent = "▶";
        activeAudio = null;
        activeAudioPage = null;
        activeAudioButton = null;
      }, { once: true });

      await audio.play();
      button.textContent = "Ⅱ";
    } catch (error) {
      console.error("Audiobook error:", error);
      button.textContent = "▶";
      alert("音声を再生できませんでした。");
    }
  }

  function updateAudioControls(visiblePages) {
    audioLeft.style.display = "none";
    audioRight.style.display = "none";
    audioLeft.onclick = null;
    audioRight.onclick = null;

    if (!visiblePages.some(pageNumber => AUDIOBOOK_PAGES[pageNumber])) {
      audioUI.classList.remove("visible");
      return;
    }

    if (visiblePages.length === 1) {
      const pageNumber = visiblePages[0];
      if (!AUDIOBOOK_PAGES[pageNumber]) return;
      audioLeft.style.display = "block";
      audioLeft.onclick = event => {
        event.stopPropagation();
        togglePageAudio(pageNumber, audioLeft);
      };
      return;
    }

    const leftPage = visiblePages[0];
    const rightPage = visiblePages[1];

    if (AUDIOBOOK_PAGES[leftPage]) {
      audioLeft.style.display = "block";
      audioLeft.onclick = event => {
        event.stopPropagation();
        togglePageAudio(leftPage, audioLeft);
      };
    }

    if (AUDIOBOOK_PAGES[rightPage]) {
      audioRight.style.display = "block";
      audioRight.onclick = event => {
        event.stopPropagation();
        togglePageAudio(rightPage, audioRight);
      };
    }
  }


  /* ========================================
     VISIBLE PAGES
  ======================================== */


  function getVisiblePages() {


    /* MOBILE */

    if (!isDesktop()) {

      return [
        currentPage
      ];

    }


    /* FRONT COVER */

    if (
      currentPage <= 1
    ) {

      return [1];

    }


    /* BACK COVER */

    if (
      currentPage >= TOTAL_PAGES
    ) {

      return [
        TOTAL_PAGES
      ];

    }


    /* SPREAD */

    let leftPage;


    if (
      currentPage % 2 === 0
    ) {

      leftPage =
        currentPage;

    }

    else {

      leftPage =
        currentPage - 1;

    }


    const rightPage =
      leftPage + 1;


    if (
      rightPage >= TOTAL_PAGES
    ) {

      return [
        TOTAL_PAGES
      ];

    }


    return [
      leftPage,
      rightPage
    ];

  }



  /* ========================================
     CREATE PAGE IMAGE
  ======================================== */


  function createPageImage(
    pageNumber
  ) {

    const img =
      document.createElement(
        "img"
      );


    img.className =
      "page";


    img.src =
      pageFile(
        pageNumber
      );


    img.alt =
      "あれこれ "
      +
      pageNumber;


    img.draggable =
      false;


    return img;

  }



  /* ========================================
     RENDER
  ======================================== */


  function render() {

    stopAudio();

    const visiblePages =
      getVisiblePages();


    pagesElement.innerHTML =
      "";


    pagesElement
      .classList
      .toggle(
        "two-pages",
        visiblePages.length === 2
      );


    visiblePages.forEach(
      pageNumber => {

        const img =
          createPageImage(
            pageNumber
          );

        img.addEventListener(
          "load",
          positionArrows,
          { once: true }
        );

        pagesElement.appendChild(
          img
        );

      }
    );

    requestAnimationFrame(
      positionArrows
    );


    updateIndicator(
      visiblePages
    );


    updateAudioControls(
      visiblePages
    );


    backToCover
      .classList
      .toggle(
        "visible",
        visiblePages.length === 1
        &&
        visiblePages[0] === TOTAL_PAGES
      );


    updateArrowAvailability();


    preloadNearbyPages(
      visiblePages
    );


    loadingElement
      .classList
      .add(
        "hidden"
      );

  }



  /* ========================================
     PAGE NUMBER
  ======================================== */


  function updateIndicator(
    visiblePages
  ) {


    if (
      visiblePages.length === 1
    ) {

      indicatorElement.textContent =
        visiblePages[0]
        +
        " / "
        +
        TOTAL_PAGES;

    }

    else {

      indicatorElement.textContent =
        visiblePages[0]
        +
        "–"
        +
        visiblePages[1]
        +
        " / "
        +
        TOTAL_PAGES;

    }

  }



  /* ========================================
     ARROW POSITION
  ======================================== */


  function positionArrows() {

    const visibleImages =
      pagesElement.querySelectorAll(".page");

    if (!visibleImages.length) {
      return;
    }

    const firstRect =
      visibleImages[0].getBoundingClientRect();

    const lastRect =
      visibleImages[visibleImages.length - 1].getBoundingClientRect();

    const bookLeft = firstRect.left;
    const bookRight = lastRect.right;
    const bookWidth = Math.max(1, bookRight - bookLeft);

    const arrowWidth =
      isDesktop() ? 72 : 52;

    if (isDesktop()) {

      const arrowGap = 20;
      const edgeZone = 92;

      leftArrow.style.left =
        Math.max(
          4,
          bookLeft - arrowWidth - arrowGap
        ) + "px";

      rightArrow.style.left =
        Math.min(
          window.innerWidth - arrowWidth - 4,
          bookRight + arrowGap
        ) + "px";

      const leftHitStart =
        Math.max(
          0,
          bookLeft - arrowWidth - arrowGap - 12
        );

      const leftHitEnd =
        Math.min(
          window.innerWidth,
          bookLeft + 44
        );

      prevZone.style.left =
        leftHitStart + "px";
      prevZone.style.right = "auto";
      prevZone.style.width =
        Math.max(1, leftHitEnd - leftHitStart) + "px";

      const rightHitStart =
        Math.max(
          0,
          bookRight - 44
        );

      const rightHitEnd =
        Math.min(
          window.innerWidth,
          bookRight + arrowGap + arrowWidth + 12
        );

      nextZone.style.left =
        rightHitStart + "px";
      nextZone.style.right = "auto";
      nextZone.style.width =
        Math.max(1, rightHitEnd - rightHitStart) + "px";

      centerZone.style.left =
        (bookLeft + bookWidth * 0.28) + "px";
      centerZone.style.right = "auto";
      centerZone.style.width =
        (bookWidth * 0.44) + "px";

    } else {

      const inset = 14;

      leftArrow.style.left =
        Math.max(
          0,
          bookLeft + inset
        ) + "px";

      rightArrow.style.left =
        Math.min(
          window.innerWidth - arrowWidth,
          bookRight - arrowWidth - inset
        ) + "px";

      prevZone.style.left = "0px";
      prevZone.style.right = "auto";
      prevZone.style.width = "28%";

      centerZone.style.left = "28%";
      centerZone.style.right = "auto";
      centerZone.style.width = "44%";

      nextZone.style.left = "72%";
      nextZone.style.right = "auto";
      nextZone.style.width = "28%";
    }

    leftArrow.style.right = "auto";
    rightArrow.style.right = "auto";

  }



  /* ========================================
     ARROW AVAILABILITY
  ======================================== */


  function updateArrowAvailability() {

    const atStart =
      currentPage <= 1;


    const atEnd =
      currentPage >= TOTAL_PAGES;


    prevZone.style.display =
      atStart
      ?
      "none"
      :
      "block";


    nextZone.style.display =
      atEnd
      ?
      "none"
      :
      "block";


    if (atStart) {

      leftArrow
        .classList
        .remove(
          "visible"
        );

    }


    if (atEnd) {

      rightArrow
        .classList
        .remove(
          "visible"
        );

    }

  }



  /* ========================================
     NEXT PAGE
  ======================================== */


  function nextPage() {


    if (
      currentPage
      >=
      TOTAL_PAGES
    ) {

      return;

    }


    /* MOBILE */

    if (!isDesktop()) {

      currentPage++;

      render();

      setTimeout(
        showMobileTurnHint,
        40
      );

      return;

    }


    /* COVER → 02 + 03 */

    if (
      currentPage === 1
    ) {

      currentPage = 2;

      render();

      return;

    }


    const visiblePages =
      getVisiblePages();


    const lastVisiblePage =
      visiblePages[
        visiblePages.length - 1
      ];


    /* LAST SPREAD → BACK COVER */

    if (
      lastVisiblePage >= 59
    ) {

      currentPage =
        TOTAL_PAGES;

    }

    else {

      currentPage =
        lastVisiblePage + 1;

    }


    render();

  }



  /* ========================================
     PREVIOUS PAGE
  ======================================== */


  function previousPage() {


    if (
      currentPage <= 1
    ) {

      return;

    }


    /* MOBILE */

    if (!isDesktop()) {

      currentPage--;

      render();

      setTimeout(
        showMobileTurnHint,
        40
      );

      return;

    }


    /* BACK COVER → 58 + 59 */

    if (
      currentPage
      ===
      TOTAL_PAGES
    ) {

      currentPage = 58;

      render();

      return;

    }


    const visiblePages =
      getVisiblePages();


    const firstVisiblePage =
      visiblePages[0];


    /* 02 + 03 → COVER */

    if (
      firstVisiblePage <= 2
    ) {

      currentPage = 1;

    }

    else {

      currentPage =
        firstVisiblePage - 2;

    }


    render();

  }



  /* ========================================
     HINT UI
  ======================================== */


  function hideHints() {

    pageUI
      .classList
      .remove(
        "visible"
      );


    leftArrow
      .classList
      .remove(
        "visible"
      );


    rightArrow
      .classList
      .remove(
        "visible"
      );


    audioUI
      .classList
      .remove(
        "visible"
      );

  }



  function showHints() {

    clearTimeout(
      hintTimer
    );


    pageUI
      .classList
      .add(
        "visible"
      );


    if (
      getVisiblePages().some(
        pageNumber => AUDIOBOOK_PAGES[pageNumber]
      )
    ) {
      audioUI
        .classList
        .add(
          "visible"
        );
    }


    if (
      currentPage > 1
    ) {

      leftArrow
        .classList
        .add(
          "visible"
        );

    }


    if (
      currentPage
      <
      TOTAL_PAGES
    ) {

      rightArrow
        .classList
        .add(
          "visible"
        );

    }


    hintTimer =
      setTimeout(
        hideHints,
        HINT_DURATION
      );

  }



  function showMobileTurnHint() {

    if (isDesktop()) {
      return;
    }

    leftArrow.classList.remove("visible");
    rightArrow.classList.remove("visible");

    if (currentPage > 1) {
      leftArrow.classList.add("visible");
    }

    if (currentPage < TOTAL_PAGES) {
      rightArrow.classList.add("visible");
    }

    setTimeout(
      () => {
        if (!isDesktop()) {
          leftArrow.classList.remove("visible");
          rightArrow.classList.remove("visible");
        }
      },
      1200
    );

  }



  function toggleHints() {


    if (
      pageUI
        .classList
        .contains(
          "visible"
        )
    ) {

      clearTimeout(
        hintTimer
      );

      hideHints();

    }

    else {

      showHints();

    }

  }



  /* ========================================
     CLICK / TAP
  ======================================== */


  prevZone
    .addEventListener(
      "click",
      () => {

        previousPage();

      }
    );


  nextZone
    .addEventListener(
      "click",
      () => {

        nextPage();

      }
    );


  centerZone
    .addEventListener(
      "click",
      () => {

        toggleHints();

      }
    );



  /* ========================================
     DESKTOP HOVER
  ======================================== */


  prevZone.addEventListener(
    "mouseenter",
    () => {
      if (isDesktop() && currentPage > 1) {
        leftArrow.classList.add("visible");
      }
    }
  );

  prevZone.addEventListener(
    "mouseleave",
    () => {
      if (isDesktop()) {
        leftArrow.classList.remove("visible");
      }
    }
  );

  nextZone.addEventListener(
    "mouseenter",
    () => {
      if (isDesktop() && currentPage < TOTAL_PAGES) {
        rightArrow.classList.add("visible");
      }
    }
  );

  nextZone.addEventListener(
    "mouseleave",
    () => {
      if (isDesktop()) {
        rightArrow.classList.remove("visible");
      }
    }
  );


  backToCover.addEventListener(
    "click",
    event => {
      event.stopPropagation();
      clearTimeout(hintTimer);
      hideHints();
      currentPage = 1;
      render();
    }
  );


  /* ========================================
     KEYBOARD
  ======================================== */


  document.addEventListener(
    "keydown",
    event => {


      if (
        event.key
        ===
        "ArrowRight"
      ) {

        nextPage();

      }


      if (
        event.key
        ===
        "ArrowLeft"
      ) {

        previousPage();

      }


      if (
        event.key
        ===
        " "
      ) {

        event.preventDefault();

        toggleHints();

      }

    }
  );



  /* ========================================
     SWIPE
  ======================================== */


  document.addEventListener(
    "touchstart",
    event => {


      if (
        event.touches.length
        !==
        1
      ) {

        return;

      }


      touchStartX =
        event.touches[0]
          .clientX;


      touchStartY =
        event.touches[0]
          .clientY;

    },
    {
      passive: true
    }
  );



  document.addEventListener(
    "touchend",
    event => {


      if (
        event.changedTouches.length
        !==
        1
      ) {

        return;

      }


      const touchEndX =
        event.changedTouches[0]
          .clientX;


      const touchEndY =
        event.changedTouches[0]
          .clientY;


      const deltaX =
        touchEndX
        -
        touchStartX;


      const deltaY =
        touchEndY
        -
        touchStartY;


      /*
        Ignore small movement
        and vertical gestures.
      */

      if (
        Math.abs(deltaX) < 45
        ||
        Math.abs(deltaX)
        <
        Math.abs(deltaY)
      ) {

        return;

      }


      if (
        deltaX < 0
      ) {

        nextPage();

      }

      else {

        previousPage();

      }

    },
    {
      passive: true
    }
  );



  /* ========================================
     PRELOAD
  ======================================== */


  function preloadPage(
    pageNumber
  ) {


    if (
      pageNumber < 1
      ||
      pageNumber
      >
      TOTAL_PAGES
    ) {

      return;

    }


    const img =
      new Image();


    img.src =
      pageFile(
        pageNumber
      );

  }



  function preloadNearbyPages(
    visiblePages
  ) {


    const first =
      visiblePages[0];


    const last =
      visiblePages[
        visiblePages.length - 1
      ];


    preloadPage(
      first - 2
    );

    preloadPage(
      first - 1
    );

    preloadPage(
      last + 1
    );

    preloadPage(
      last + 2
    );

  }



  /* ========================================
     RESIZE
  ======================================== */


  let resizeTimer;


  window.addEventListener(
    "resize",
    () => {


      clearTimeout(
        resizeTimer
      );


      resizeTimer =
        setTimeout(
          () => {


            /*
              If switching into desktop
              while on an odd inner page,
              normalize to its spread.
            */

            if (
              isDesktop()
              &&
              currentPage > 1
              &&
              currentPage
              <
              TOTAL_PAGES
              &&
              currentPage % 2 !== 0
            ) {

              currentPage--;

            }


            hideHints();

            render();

            requestAnimationFrame(
              positionArrows
            );

          },
          120
        );

    }
  );



  /* ========================================
     START
  ======================================== */


  render();


  /*
    First-time navigation hint.

    Mainly useful on phones:
    tells the reader that the book
    can be turned without leaving
    permanent UI on screen.
  */

  setTimeout(
    () => {

      showHints();

    },
    450
  );

</script>

</body>
</html>
