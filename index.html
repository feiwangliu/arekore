<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>あれこれ</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #111111;
      overflow: hidden;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
    }

    #reader {
      width: 100vw;
      height: 100vh;
      height: 100dvh;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #111111;
    }

    #cover {
      display: block;

      width: auto;
      height: auto;

      max-width: 100vw;
      max-height: 100vh;
      max-height: 100dvh;

      object-fit: contain;

      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
    }
  </style>
</head>

<body>

  <main id="reader">
    <img
      id="cover"
      src="/arekore/01.jpg"
      alt="あれこれ"
    >
  </main>

</body>
</html>
