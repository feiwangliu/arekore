<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#151515">

  <title>あれこれ</title>

  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #151515;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Sans",
        "Yu Gothic",
        sans-serif;
    }

    body {
      overscroll-behavior: none;
      touch-action: manipulation;
    }


    /* ========================================
       READER
    ======================================== */

    #reader {
      position: fixed;
      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      background: #151515;

      user-select: none;
      -webkit-user-select: none;
    }


    #book {
      width: 100%;
      height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      padding:
        env(safe-area-inset-top)
        env(safe-area-inset-right)
        env(safe-area-inset-bottom)
        env(safe-area-inset-left);
    }


    #pages {
      width: 100%;
      height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 0;

      position: relative;
    }


    .page {
      display: block;

      width: auto;
      height: auto;

      max-width: 100%;
      max-height: 100%;

      object-fit: contain;

      background: #fff;

      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
    }


    /* ========================================
       DESKTOP DOUBLE PAGE
    ======================================== */

    @media (min-width: 900px) {

      #pages.two-pages .page {
        max-width: 50%;
        max-height: 100%;
      }

      #pages.two-pages .page:first-child {
        box-shadow:
          inset -24px 0 22px -18px rgba(0,0,0,0.55),
          -16px 0 14px -12px rgba(0,0,0,0.30),
          0 10px 14px -16px rgba(0,0,0,0.22);
      }

      #pages.two-pages .page:last-child {
        box-shadow:
          inset 24px 0 22px -18px rgba(0,0,0,0.55),
          16px 0 14px -12px rgba(0,0,0,0.30),
          0 10px 14px -16px rgba(0,0,0,0.22);
      }

      #pages.two-pages::before {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        left: 50%;
        width: 54px;
        transform: translateX(-50%);
        pointer-events: none;
        z-index: 4;
        background:
          linear-gradient(
            to right,
            rgba(255,255,255,0) 0%,
            rgba(255,255,255,0.055) 15%,
            rgba(0,0,0,0.035) 28%,
            rgba(0,0,0,0.11) 40%,
            rgba(0,0,0,0.23) 47%,
            rgba(0,0,0,0.42) 49%,
            rgba(0,0,0,0.52) 50%,
            rgba(0,0,0,0.42) 51%,
            rgba(0,0,0,0.23) 53%,
            rgba(0,0,0,0.11) 60%,
            rgba(0,0,0,0.035) 72%,
            rgba(255,255,255,0.055) 85%,
            rgba(255,255,255,0) 100%
          );
      }

      #pages.two-pages::after {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        left: 50%;
        width: 4px;
        transform: translateX(-50%);
        pointer-events: none;
        z-index: 5;
        background:
          linear-gradient(
            to right,
            rgba(0,0,0,0.52),
            rgba(0,0,0,0.78),
            rgba(0,0,0,0.52)
          );
        box-shadow:
          -2px 0 3px rgba(255,255,255,0.07),
          2px 0 3px rgba(255,255,255,0.07);
      }

      #pages.two-pages .page:first-child {
        filter:
          drop-shadow(-16px 0 14px rgba(0,0,0,0.30))
          drop-shadow(0 10px 10px rgba(0,0,0,0.12));
      }

      #pages.two-pages .page:last-child {
        filter:
          drop-shadow(16px 0 14px rgba(0,0,0,0.30))
          drop-shadow(0 10px 10px rgba(0,0,0,0.12));
      }

      #pages:not(.two-pages) .page {
        filter:
          drop-shadow(-14px 0 14px rgba(0,0,0,0.24))
          drop-shadow(14px 0 14px rgba(0,0,0,0.24))
          drop-shadow(0 10px 10px rgba(0,0,0,0.10));
      }

    }


    /* ========================================
       MOBILE SINGLE PAGE
    ======================================== */

    @media (max-width: 899px) {

      #book {
        padding: 0;
      }

      .page {
        max-width: 100vw;
        max-height: 100dvh;
      }

    }


    /* ========================================
       INVISIBLE NAVIGATION ZONES
    ======================================== */

    .tap-zone {
      position: fixed;

      top: 0;
      bottom: 0;

      z-index: 20;
    }


    #prevZone,
    #centerZone,
    #nextZone {
      width: auto;
    }



    /* ========================================
       LARGE SIDE ARROWS
    ======================================== */

    .side-arrow {
      position: fixed;

      top: 50%;

      transform: translateY(-50%);

      z-index: 15;

      display: flex;
      align-items: center;
      justify-content: center;

      width: 72px;
      height: 120px;

      color: rgba(255,255,255,0.82);

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size: 64px;
      font-weight: 200;
      line-height: 1;

      opacity: 0;

      pointer-events: none;

      transition:
        opacity 280ms ease,
        transform 280ms ease;

      text-shadow:
        0 1px 7px rgba(0,0,0,0.45);
    }


    #leftArrow {
      left:
        calc(12px + env(safe-area-inset-left));

      transform:
        translateY(-50%)
        translateX(-6px);
    }


    #rightArrow {
      right:
        calc(12px + env(safe-area-inset-right));

      transform:
        translateY(-50%)
        translateX(6px);
    }


    .side-arrow.visible {
      opacity: 0.62;
    }


    #leftArrow.visible {
      transform:
        translateY(-50%)
        translateX(0);
    }


    #rightArrow.visible {
      transform:
        translateY(-50%)
        translateX(0);
    }


    /* ========================================
       MOBILE ARROWS
    ======================================== */

    @media (max-width: 899px) {

      .side-arrow {
        width: 52px;
        height: 100px;

        font-size: 52px;

        color: rgba(255,255,255,0.9);
      }


      #leftArrow {
        left:
          calc(2px + env(safe-area-inset-left));
      }


      #rightArrow {
        right:
          calc(2px + env(safe-area-inset-right));
      }


      .side-arrow.visible {
        opacity: 0.52;
      }

    }


    /* ========================================
       PAGE INDICATOR
    ======================================== */

    #pageUI {
      position: fixed;

      left: 50%;

      bottom:
        calc(18px + env(safe-area-inset-bottom));

      transform:
        translateX(-50%)
        translateY(5px);

      z-index: 30;

      padding:
        7px 13px;

      border-radius: 999px;

      background:
        rgba(20,20,20,0.68);

      color:
        rgba(255,255,255,0.92);

      font-size: 12px;

      letter-spacing: 0.02em;

      white-space: nowrap;

      font-variant-numeric:
        tabular-nums;

      backdrop-filter:
        blur(8px);

      -webkit-backdrop-filter:
        blur(8px);

      opacity: 0;

      pointer-events: none;

      transition:
        opacity 220ms ease,
        transform 220ms ease;
    }


    #pageUI.visible {
      opacity: 1;

      transform:
        translateX(-50%)
        translateY(0);
    }


    /* ========================================
       LOADING
    ======================================== */

    #loading {
      position: fixed;
      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      color:
        rgba(255,255,255,0.45);

      font-size: 11px;

      letter-spacing: 0.08em;

      pointer-events: none;

      z-index: 2;
    }


    #loading.hidden {
      display: none;
    }

  </style>
</head>


<body>


  <main id="reader">

    <div id="loading">
      loading…
    </div>

    <div id="book">
      <div id="pages"></div>
    </div>

  </main>


  <!-- Invisible navigation -->

  <div
    id="prevZone"
    class="tap-zone">
  </div>

  <div
    id="centerZone"
    class="tap-zone">
  </div>

  <div
    id="nextZone"
    class="tap-zone">
  </div>


  <!-- Large navigation hints -->

  <div
    id="leftArrow"
    class="side-arrow"
    aria-hidden="true">
    ‹
  </div>

  <div
    id="rightArrow"
    class="side-arrow"
    aria-hidden="true">
    ›
  </div>


  <!-- Page number -->

  <div id="pageUI">
    <span id="pageIndicator">
      1 / 60
    </span>
  </div>



<script>

  /*
    ==========================================
    あれこれ
    Digital Edition
    First Edition · 2026
    ==========================================
  */


  const TOTAL_PAGES = 60;

  const DESKTOP_BREAKPOINT = 900;

  const HINT_DURATION = 2600;


  let currentPage = 1;

  let hintTimer = null;

  let touchStartX = 0;
  let touchStartY = 0;


  const pagesElement =
    document.getElementById("pages");

  const loadingElement =
    document.getElementById("loading");

  const pageUI =
    document.getElementById("pageUI");

  const indicatorElement =
    document.getElementById("pageIndicator");

  const leftArrow =
    document.getElementById("leftArrow");

  const rightArrow =
    document.getElementById("rightArrow");

  const prevZone =
    document.getElementById("prevZone");

  const centerZone =
    document.getElementById("centerZone");

  const nextZone =
    document.getElementById("nextZone");



  /* ========================================
     MODE
  ======================================== */


  function isDesktop() {

    return (
      window.innerWidth
      >=
      DESKTOP_BREAKPOINT
    );

  }



  /* ========================================
     FILE NAMES
  ======================================== */


  function pageFile(pageNumber) {

    return (
      String(pageNumber)
        .padStart(2, "0")
      +
      ".jpg"
    );

  }



  /* ========================================
     VISIBLE PAGES
  ======================================== */


  function getVisiblePages() {


    /* MOBILE */

    if (!isDesktop()) {

      return [
        currentPage
      ];

    }


    /* FRONT COVER */

    if (
      currentPage <= 1
    ) {

      return [1];

    }


    /* BACK COVER */

    if (
      currentPage >= TOTAL_PAGES
    ) {

      return [
        TOTAL_PAGES
      ];

    }


    /* SPREAD */

    let leftPage;


    if (
      currentPage % 2 === 0
    ) {

      leftPage =
        currentPage;

    }

    else {

      leftPage =
        currentPage - 1;

    }


    const rightPage =
      leftPage + 1;


    if (
      rightPage >= TOTAL_PAGES
    ) {

      return [
        TOTAL_PAGES
      ];

    }


    return [
      leftPage,
      rightPage
    ];

  }



  /* ========================================
     CREATE PAGE IMAGE
  ======================================== */


  function createPageImage(
    pageNumber
  ) {

    const img =
      document.createElement(
        "img"
      );


    img.className =
      "page";


    img.src =
      pageFile(
        pageNumber
      );


    img.alt =
      "あれこれ "
      +
      pageNumber;


    img.draggable =
      false;


    return img;

  }



  /* ========================================
     RENDER
  ======================================== */


  function render() {

    const visiblePages =
      getVisiblePages();


    pagesElement.innerHTML =
      "";


    pagesElement
      .classList
      .toggle(
        "two-pages",
        visiblePages.length === 2
      );


    visiblePages.forEach(
      pageNumber => {

        const img =
          createPageImage(
            pageNumber
          );

        img.addEventListener(
          "load",
          positionArrows,
          { once: true }
        );

        pagesElement.appendChild(
          img
        );

      }
    );

    requestAnimationFrame(
      positionArrows
    );


    updateIndicator(
      visiblePages
    );


    updateArrowAvailability();


    preloadNearbyPages(
      visiblePages
    );


    loadingElement
      .classList
      .add(
        "hidden"
      );

  }



  /* ========================================
     PAGE NUMBER
  ======================================== */


  function updateIndicator(
    visiblePages
  ) {


    if (
      visiblePages.length === 1
    ) {

      indicatorElement.textContent =
        visiblePages[0]
        +
        " / "
        +
        TOTAL_PAGES;

    }

    else {

      indicatorElement.textContent =
        visiblePages[0]
        +
        "–"
        +
        visiblePages[1]
        +
        " / "
        +
        TOTAL_PAGES;

    }

  }



  /* ========================================
     ARROW POSITION
  ======================================== */


  function positionArrows() {

    const visibleImages =
      pagesElement.querySelectorAll(".page");

    if (!visibleImages.length) {
      return;
    }

    const firstRect =
      visibleImages[0].getBoundingClientRect();

    const lastRect =
      visibleImages[visibleImages.length - 1].getBoundingClientRect();

    const bookLeft = firstRect.left;
    const bookRight = lastRect.right;
    const bookWidth = Math.max(1, bookRight - bookLeft);

    const arrowWidth =
      isDesktop() ? 72 : 52;

    if (isDesktop()) {

      const arrowGap = 20;
      const edgeZone = 92;

      leftArrow.style.left =
        Math.max(
          4,
          bookLeft - arrowWidth - arrowGap
        ) + "px";

      rightArrow.style.left =
        Math.min(
          window.innerWidth - arrowWidth - 4,
          bookRight + arrowGap
        ) + "px";

      const leftHitStart =
        Math.max(
          0,
          bookLeft - arrowWidth - arrowGap - 12
        );

      const leftHitEnd =
        Math.min(
          window.innerWidth,
          bookLeft + 44
        );

      prevZone.style.left =
        leftHitStart + "px";
      prevZone.style.right = "auto";
      prevZone.style.width =
        Math.max(1, leftHitEnd - leftHitStart) + "px";

      const rightHitStart =
        Math.max(
          0,
          bookRight - 44
        );

      const rightHitEnd =
        Math.min(
          window.innerWidth,
          bookRight + arrowGap + arrowWidth + 12
        );

      nextZone.style.left =
        rightHitStart + "px";
      nextZone.style.right = "auto";
      nextZone.style.width =
        Math.max(1, rightHitEnd - rightHitStart) + "px";

      centerZone.style.left =
        (bookLeft + bookWidth * 0.28) + "px";
      centerZone.style.right = "auto";
      centerZone.style.width =
        (bookWidth * 0.44) + "px";

    } else {

      const inset = 14;

      leftArrow.style.left =
        Math.max(
          0,
          bookLeft + inset
        ) + "px";

      rightArrow.style.left =
        Math.min(
          window.innerWidth - arrowWidth,
          bookRight - arrowWidth - inset
        ) + "px";

      prevZone.style.left = "0px";
      prevZone.style.right = "auto";
      prevZone.style.width = "28%";

      centerZone.style.left = "28%";
      centerZone.style.right = "auto";
      centerZone.style.width = "44%";

      nextZone.style.left = "72%";
      nextZone.style.right = "auto";
      nextZone.style.width = "28%";
    }

    leftArrow.style.right = "auto";
    rightArrow.style.right = "auto";

  }



  /* ========================================
     ARROW AVAILABILITY
  ======================================== */


  function updateArrowAvailability() {

    const atStart =
      currentPage <= 1;


    const atEnd =
      currentPage >= TOTAL_PAGES;


    prevZone.style.display =
      atStart
      ?
      "none"
      :
      "block";


    nextZone.style.display =
      atEnd
      ?
      "none"
      :
      "block";


    if (atStart) {

      leftArrow
        .classList
        .remove(
          "visible"
        );

    }


    if (atEnd) {

      rightArrow
        .classList
        .remove(
          "visible"
        );

    }

  }



  /* ========================================
     NEXT PAGE
  ======================================== */


  function nextPage() {


    if (
      currentPage
      >=
      TOTAL_PAGES
    ) {

      return;

    }


    /* MOBILE */

    if (!isDesktop()) {

      currentPage++;

      render();

      setTimeout(
        showMobileTurnHint,
        40
      );

      return;

    }


    /* COVER → 02 + 03 */

    if (
      currentPage === 1
    ) {

      currentPage = 2;

      render();

      return;

    }


    const visiblePages =
      getVisiblePages();


    const lastVisiblePage =
      visiblePages[
        visiblePages.length - 1
      ];


    /* LAST SPREAD → BACK COVER */

    if (
      lastVisiblePage >= 59
    ) {

      currentPage =
        TOTAL_PAGES;

    }

    else {

      currentPage =
        lastVisiblePage + 1;

    }


    render();

  }



  /* ========================================
     PREVIOUS PAGE
  ======================================== */


  function previousPage() {


    if (
      currentPage <= 1
    ) {

      return;

    }


    /* MOBILE */

    if (!isDesktop()) {

      currentPage--;

      render();

      setTimeout(
        showMobileTurnHint,
        40
      );

      return;

    }


    /* BACK COVER → 58 + 59 */

    if (
      currentPage
      ===
      TOTAL_PAGES
    ) {

      currentPage = 58;

      render();

      return;

    }


    const visiblePages =
      getVisiblePages();


    const firstVisiblePage =
      visiblePages[0];


    /* 02 + 03 → COVER */

    if (
      firstVisiblePage <= 2
    ) {

      currentPage = 1;

    }

    else {

      currentPage =
        firstVisiblePage - 2;

    }


    render();

  }



  /* ========================================
     HINT UI
  ======================================== */


  function hideHints() {

    pageUI
      .classList
      .remove(
        "visible"
      );


    leftArrow
      .classList
      .remove(
        "visible"
      );


    rightArrow
      .classList
      .remove(
        "visible"
      );

  }



  function showHints() {

    clearTimeout(
      hintTimer
    );


    pageUI
      .classList
      .add(
        "visible"
      );


    if (
      currentPage > 1
    ) {

      leftArrow
        .classList
        .add(
          "visible"
        );

    }


    if (
      currentPage
      <
      TOTAL_PAGES
    ) {

      rightArrow
        .classList
        .add(
          "visible"
        );

    }


    hintTimer =
      setTimeout(
        hideHints,
        HINT_DURATION
      );

  }



  function showMobileTurnHint() {

    if (isDesktop()) {
      return;
    }

    leftArrow.classList.remove("visible");
    rightArrow.classList.remove("visible");

    if (currentPage > 1) {
      leftArrow.classList.add("visible");
    }

    if (currentPage < TOTAL_PAGES) {
      rightArrow.classList.add("visible");
    }

    setTimeout(
      () => {
        if (!isDesktop()) {
          leftArrow.classList.remove("visible");
          rightArrow.classList.remove("visible");
        }
      },
      1200
    );

  }



  function toggleHints() {


    if (
      pageUI
        .classList
        .contains(
          "visible"
        )
    ) {

      clearTimeout(
        hintTimer
      );

      hideHints();

    }

    else {

      showHints();

    }

  }



  /* ========================================
     CLICK / TAP
  ======================================== */


  prevZone
    .addEventListener(
      "click",
      () => {

        previousPage();

      }
    );


  nextZone
    .addEventListener(
      "click",
      () => {

        nextPage();

      }
    );


  centerZone
    .addEventListener(
      "click",
      () => {

        toggleHints();

      }
    );



  /* ========================================
     DESKTOP HOVER
  ======================================== */


  prevZone.addEventListener(
    "mouseenter",
    () => {
      if (isDesktop() && currentPage > 1) {
        leftArrow.classList.add("visible");
      }
    }
  );

  prevZone.addEventListener(
    "mouseleave",
    () => {
      if (isDesktop()) {
        leftArrow.classList.remove("visible");
      }
    }
  );

  nextZone.addEventListener(
    "mouseenter",
    () => {
      if (isDesktop() && currentPage < TOTAL_PAGES) {
        rightArrow.classList.add("visible");
      }
    }
  );

  nextZone.addEventListener(
    "mouseleave",
    () => {
      if (isDesktop()) {
        rightArrow.classList.remove("visible");
      }
    }
  );


  /* ========================================
     KEYBOARD
  ======================================== */


  document.addEventListener(
    "keydown",
    event => {


      if (
        event.key
        ===
        "ArrowRight"
      ) {

        nextPage();

      }


      if (
        event.key
        ===
        "ArrowLeft"
      ) {

        previousPage();

      }


      if (
        event.key
        ===
        " "
      ) {

        event.preventDefault();

        toggleHints();

      }

    }
  );



  /* ========================================
     SWIPE
  ======================================== */


  document.addEventListener(
    "touchstart",
    event => {


      if (
        event.touches.length
        !==
        1
      ) {

        return;

      }


      touchStartX =
        event.touches[0]
          .clientX;


      touchStartY =
        event.touches[0]
          .clientY;

    },
    {
      passive: true
    }
  );



  document.addEventListener(
    "touchend",
    event => {


      if (
        event.changedTouches.length
        !==
        1
      ) {

        return;

      }


      const touchEndX =
        event.changedTouches[0]
          .clientX;


      const touchEndY =
        event.changedTouches[0]
          .clientY;


      const deltaX =
        touchEndX
        -
        touchStartX;


      const deltaY =
        touchEndY
        -
        touchStartY;


      /*
        Ignore small movement
        and vertical gestures.
      */

      if (
        Math.abs(deltaX) < 45
        ||
        Math.abs(deltaX)
        <
        Math.abs(deltaY)
      ) {

        return;

      }


      if (
        deltaX < 0
      ) {

        nextPage();

      }

      else {

        previousPage();

      }

    },
    {
      passive: true
    }
  );



  /* ========================================
     PRELOAD
  ======================================== */


  function preloadPage(
    pageNumber
  ) {


    if (
      pageNumber < 1
      ||
      pageNumber
      >
      TOTAL_PAGES
    ) {

      return;

    }


    const img =
      new Image();


    img.src =
      pageFile(
        pageNumber
      );

  }



  function preloadNearbyPages(
    visiblePages
  ) {


    const first =
      visiblePages[0];


    const last =
      visiblePages[
        visiblePages.length - 1
      ];


    preloadPage(
      first - 2
    );

    preloadPage(
      first - 1
    );

    preloadPage(
      last + 1
    );

    preloadPage(
      last + 2
    );

  }



  /* ========================================
     RESIZE
  ======================================== */


  let resizeTimer;


  window.addEventListener(
    "resize",
    () => {


      clearTimeout(
        resizeTimer
      );


      resizeTimer =
        setTimeout(
          () => {


            /*
              If switching into desktop
              while on an odd inner page,
              normalize to its spread.
            */

            if (
              isDesktop()
              &&
              currentPage > 1
              &&
              currentPage
              <
              TOTAL_PAGES
              &&
              currentPage % 2 !== 0
            ) {

              currentPage--;

            }


            hideHints();

            render();

            requestAnimationFrame(
              positionArrows
            );

          },
          120
        );

    }
  );



  /* ========================================
     START
  ======================================== */


  render();


  /*
    First-time navigation hint.

    Mainly useful on phones:
    tells the reader that the book
    can be turned without leaving
    permanent UI on screen.
  */

  setTimeout(
    () => {

      showHints();

    },
    450
  );

</script>
