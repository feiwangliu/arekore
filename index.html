<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#eef1f2">

  <title>あれこれ</title>

  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #151515;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Sans",
        "Yu Gothic",
        sans-serif;
    }

    body {
      overscroll-behavior: none;
      touch-action: manipulation;
    }


    /* ========================================
       READER
    ======================================== */

    #reader {
      position: fixed;
      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      background: #151515;

      user-select: none;
      -webkit-user-select: none;
    }


    #book {
      width: 100%;
      height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      padding:
        env(safe-area-inset-top)
        env(safe-area-inset-right)
        env(safe-area-inset-bottom)
        env(safe-area-inset-left);
    }


    #pages {
      width: 100%;
      height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 0;

      position: relative;
    }


    .page {
      display: block;

      width: auto;
      height: auto;

      max-width: 100%;
      max-height: 100%;

      object-fit: contain;

      background: #fff;

      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
    }


    /* ========================================
       DESKTOP DOUBLE PAGE
    ======================================== */

    @media (min-width: 900px) {

      /*
        Desktop: make the spread read as a physical open book.
        Keep the JPGs themselves untouched; all depth is CSS-only.
      */

      #book {
        padding: 2.5vh 0;
      }

      #pages {
        height: 95vh;
        width: 100%;
      }

      #pages.two-pages {
        gap: 0;
        isolation: isolate;
      }

      #pages.two-pages .page {
        max-width: 50%;
        max-height: 95vh;
        position: relative;
      }

      /*
        Outer paper edges: a light rim is visible against the black reader.
        This is deliberately not a black drop shadow.
      */

      /* Natural center fold: no divider line, no physical gap. */
      #pages.two-pages::before,
      #pages.two-pages::after { content: none !important; display: none !important; }

      #pages.two-pages .page:first-child {
        border-left: 5px solid rgb(239,236,229);
        box-shadow:
          -2px 0 0 rgba(210,210,202,0.28),
          -10px 0 22px rgba(255,255,248,0.10),
          inset -36px 0 16px -28px rgba(62,56,49,0.133);
      }

      #pages.two-pages .page:last-child {
        border-right: 5px solid rgb(239,236,229);
        box-shadow:
          2px 0 0 rgba(210,210,202,0.28),
          10px 0 22px rgba(255,255,248,0.10),
          inset 36px 0 16px -28px rgba(62,56,49,0.133);
      }

      /* Cover / back cover shown alone. */

      #pages:not(.two-pages) .page {
        max-height: 95vh;
        border-left: 2px solid rgba(255,255,248,0.66);
        border-right: 2px solid rgba(255,255,248,0.66);
        box-shadow:
          -2px 0 0 rgba(210,210,202,0.28),
          2px 0 0 rgba(210,210,202,0.28),
          -10px 0 22px rgba(255,255,248,0.10),
          10px 0 22px rgba(255,255,248,0.10);
      }

    }


    /* ========================================
       MOBILE SINGLE PAGE
    ======================================== */

    @media (max-width: 899px) {

      #book {
        padding: 0;
      }

      .page {
        max-width: 100vw;
        max-height: 100dvh;
      }

    }


    /* ========================================
       INVISIBLE NAVIGATION ZONES
    ======================================== */

    .tap-zone {
      position: fixed;

      top: 0;
      bottom: 0;

      z-index: 20;
    }


    #prevZone,
    #centerZone,
    #nextZone {
      width: auto;
    }



    /* ========================================
       LARGE SIDE ARROWS
    ======================================== */

    .side-arrow {
      position: fixed;

      top: 50%;

      transform: translateY(-50%);

      z-index: 15;

      display: flex;
      align-items: center;
      justify-content: center;

      width: 72px;
      height: 120px;

      color: rgba(255,255,255,0.82);

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size: 64px;
      font-weight: 200;
      line-height: 1;

      opacity: 0;

      pointer-events: none;

      transition:
        opacity 280ms ease,
        transform 280ms ease;

      text-shadow:
        0 1px 7px rgba(0,0,0,0.45);
    }


    #leftArrow {
      left:
        calc(12px + env(safe-area-inset-left));

      transform:
        translateY(-50%)
        translateX(-6px);
    }


    #rightArrow {
      right:
        calc(12px + env(safe-area-inset-right));

      transform:
        translateY(-50%)
        translateX(6px);
    }


    .side-arrow.visible {
      opacity: 0.62;
    }


    #leftArrow.visible {
      transform:
        translateY(-50%)
        translateX(0);
    }


    #rightArrow.visible {
      transform:
        translateY(-50%)
        translateX(0);
    }


    /* ========================================
       MOBILE ARROWS
    ======================================== */

    @media (max-width: 899px) {

      .side-arrow {
        width: 52px;
        height: 100px;

        font-size: 52px;

        color: rgba(255,255,255,0.9);
      }


      #leftArrow {
        left:
          calc(2px + env(safe-area-inset-left));
      }


      #rightArrow {
        right:
          calc(2px + env(safe-area-inset-right));
      }


      .side-arrow.visible {
        opacity: 0.52;
      }

    }


    /* ========================================
       PAGE INDICATOR
    ======================================== */

    #pageUI {
      position: fixed;

      left: 50%;

      bottom:
        calc(18px + env(safe-area-inset-bottom));

      transform:
        translateX(-50%)
        translateY(5px);

      z-index: 30;

      padding:
        7px 13px;

      border-radius: 999px;

      background:
        rgba(20,20,20,0.68);

      color:
        rgba(255,255,255,0.92);

      font-size: 12px;

      letter-spacing: 0.02em;

      white-space: nowrap;

      font-variant-numeric:
        tabular-nums;

      backdrop-filter:
        blur(8px);

      -webkit-backdrop-filter:
        blur(8px);

      opacity: 0;

      pointer-events: none;

      transition:
        opacity 220ms ease,
        transform 220ms ease;
    }


    #pageUI.visible {
      opacity: 1;

      transform:
        translateX(-50%)
        translateY(0);
    }




    /* ========================================
       AUDIOBOOK V1 · P4 / P5
    ======================================== */

    #audioUI {
      position: fixed;
      left: 0;
      right: 0;
      bottom: calc(58px + env(safe-area-inset-bottom));
      z-index: 31;
      pointer-events: none;
      opacity: 0;
      transition: opacity 220ms ease;
    }

    #audioUI.visible { opacity: 1; }

    .audio-button {
      position: fixed;
      bottom: calc(58px + env(safe-area-inset-bottom));
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 50%;
      background: rgba(20,20,20,0.68);
      color: rgba(255,255,255,0.94);
      font-size: 15px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      cursor: pointer;
      pointer-events: auto;
      display: none;
    }

    #audioLeft { left: calc(50% - 72px); }
    #audioRight { left: calc(50% + 30px); }

    @media (max-width: 899px) {
      #audioLeft,
      #audioRight {
        left: 50%;
        transform: translateX(-50%);
      }
    }


    /* ========================================
       BACK TO COVER
    ======================================== */

    #backToCover {
      position: fixed;
      left: 50%;
      bottom: calc(24px + env(safe-area-inset-bottom));
      transform: translateX(-50%) translateY(4px);
      z-index: 32;
      padding: 8px 14px;
      border: 0;
      border-radius: 999px;
      background: rgba(20,20,20,0.58);
      color: rgba(255,255,255,0.90);
      font: inherit;
      font-size: 12px;
      letter-spacing: 0.02em;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 220ms ease, transform 220ms ease, background 180ms ease;
    }

    #backToCover.visible {
      opacity: 0.78;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }

    #backToCover:hover,
    #backToCover:focus-visible {
      opacity: 1;
      background: rgba(20,20,20,0.76);
      outline: none;
    }


    /* ========================================
       LOADING
    ======================================== */

    #loading {
      position: fixed;
      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      color:
        rgba(255,255,255,0.45);

      font-size: 11px;

      letter-spacing: 0.08em;

      pointer-events: none;

      z-index: 2;
    }


    #loading.hidden {
      display: none;
    }

/* ===== AREKORE · EDITORIAL READER V2 (visual layer only) ===== */
:root { --ink:#263943; --muted:#788c98; --accent:#718e9e; --canvas:#eef1f2; --line:#e3e8eb; --top:56px; --bottom:62px; }
html,body,#reader { background:var(--canvas); color:var(--ink); }
#reader { inset:var(--top) 0 var(--bottom); overflow:hidden; background:radial-gradient(ellipse at 50% 45%, #f8fafb 0%, #edf0f2 78%); }
#book { padding:12px 66px; }
#pages { width:100%; height:100%; filter:drop-shadow(0 12px 15px rgba(43,59,68,.13)); }
.page { box-shadow:none; }
@media (min-width:900px) {
 #book { padding:12px 75px; }
 #pages { height:100%; }
 #pages.two-pages .page { max-height:calc(100dvh - var(--top) - var(--bottom) - 24px); border:0!important; box-shadow:none!important; }
 #pages.two-pages .page:first-child { box-shadow:inset -8px 0 11px -10px rgba(40,50,55,.25)!important; }
 #pages.two-pages .page:last-child { box-shadow:inset 8px 0 11px -10px rgba(40,50,55,.25)!important; }
 #pages:not(.two-pages) .page { max-height:calc(100dvh - var(--top) - var(--bottom) - 24px); border:0!important; box-shadow:0 10px 22px rgba(43,59,68,.12)!important; }
}
@media (max-width:899px) {
 :root { --top:48px; --bottom:52px; }
 #book { padding:6px 7px; }
 #pages .page { max-height:calc(100dvh - var(--top) - var(--bottom) - 12px); max-width:100%; }
}
#readerHeader { position:fixed; inset:0 0 auto; height:var(--top); z-index:60; display:flex; align-items:center; justify-content:space-between; padding:0 clamp(14px,3vw,36px); background:rgba(255,255,255,.94); border-bottom:1px solid var(--line); }
.brand { display:flex; align-items:baseline; gap:13px; white-space:nowrap; }
.brand strong { font-size:17px; letter-spacing:.06em; font-weight:700; }
.brand small { font-size:10px; color:#94a3ae; letter-spacing:.12em; }
.headerTools { display:flex; gap:6px; align-items:center; }
.toolButton { border:0; background:transparent; color:#526a78; border-radius:50%; height:36px; width:36px; display:grid; place-items:center; cursor:pointer; transition:background .18s,transform .18s; }
.toolButton:hover,.toolButton:focus-visible { background:#eaf0f3; outline:none; }
.toolButton:active { transform:scale(.94); }
.toolButton svg { width:19px; height:19px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
#readerFooter { position:fixed; inset:auto 0 0; height:var(--bottom); z-index:60; display:flex; align-items:center; gap:24px; padding:0 clamp(16px,3vw,38px); background:rgba(255,255,255,.95); border-top:1px solid var(--line); }
.footerLabel { display:flex; align-items:center; gap:9px; color:#637987; font-size:12px; white-space:nowrap; }
.footerLabel svg { width:17px; height:17px; stroke:currentColor; fill:none; stroke-width:1.6; }
#progressSlider { flex:1; min-width:30px; height:3px; border-radius:10px; appearance:none; -webkit-appearance:none; background:linear-gradient(to right,var(--accent) 0%,var(--accent) var(--progress,0%),#e1e6e9 var(--progress,0%),#e1e6e9 100%); cursor:pointer; outline:none; }
#progressSlider::-webkit-slider-thumb { appearance:none; width:10px; height:10px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 4px #fff; }
#progressSlider::-moz-range-thumb { width:10px; height:10px; border:0; border-radius:50%; background:var(--accent); }
#pageUI { position:static; transform:none!important; opacity:1!important; background:none; backdrop-filter:none; color:#526b7a; font-size:12px; padding:0; pointer-events:auto; z-index:auto; order:2; }
#pageIndicator { font-variant-numeric:tabular-nums; letter-spacing:.045em; }
#progressSlider { order:1; }
.footerLabel { order:0; }
.side-arrow { width:43px!important; height:43px!important; border-radius:50%; background:rgba(255,255,255,.94); box-shadow:0 3px 15px rgba(47,64,73,.13); color:#536d7c!important; font-family:Arial,sans-serif; font-size:36px!important; line-height:1; text-shadow:none; opacity:0; transition:opacity .2s,transform .2s; }
.side-arrow.visible { opacity:.95!important; }
#leftArrow,#rightArrow { z-index:25; }
.tap-zone { top:var(--top); bottom:var(--bottom); }
#audioUI { position:fixed; bottom:calc(var(--bottom) + 12px); left:0; right:0; z-index:40; }
.audio-button { bottom:calc(var(--bottom) + 12px); width:40px; height:40px; background:rgba(255,255,255,.97); color:#506e7d; border:1px solid #e1e7e9; box-shadow:0 3px 13px rgba(47,64,73,.12); font-size:15px; }
#audioLeft { left:calc(50% - 56px); } #audioRight { left:calc(50% + 16px); }
#backToCover { bottom:calc(var(--bottom) + 18px); background:#fff; color:#526b7a; border:1px solid #dce5e9; box-shadow:0 4px 15px rgba(47,64,73,.12); }
#backToCover.visible { opacity:1; } #backToCover:hover { background:#eef4f6; }
#loading { color:#788d98; }
@media(max-width:899px) {
 .brand strong { font-size:15px; } .brand small { font-size:8px; letter-spacing:.07em; }
 #readerFooter { gap:14px; padding:0 16px; }
 .footerLabel { display:none; }
 #pageUI { min-width:65px; text-align:right; }
 .side-arrow { width:34px!important; height:34px!important; font-size:30px!important; }
 #audioLeft,#audioRight { left:50%; transform:translateX(-50%); }
}
@media(max-width:360px) { .brand small { display:none; } }

/* V6 · Real paper sheets: the image sits INSIDE each page, not over a frame. */
#reader { background:radial-gradient(ellipse at 50% 42%,#f8fafb 0%,#edf0f2 80%); }
#pages { filter:none!important; gap:0; }
.page-sheet { position:relative; flex:0 0 auto; display:flex; align-items:center; justify-content:center; background:#fffdfa; }
.page-sheet .page { display:block; width:auto; height:auto; max-width:100%; max-height:100%; object-fit:contain; border:0!important; border-radius:0!important; box-shadow:none!important; transform:none!important; }
@media(min-width:900px) {
  #book { padding:22px 80px 32px; }
  #pages { height:100%; perspective:2000px; align-items:center; }
  #pages.two-pages { isolation:isolate; }
  #pages.two-pages::before,#pages.two-pages::after { display:none!important;content:none!important; }
  #pages.two-pages .page-sheet { height:min(calc(100dvh - var(--top) - var(--bottom) - 74px), 72vw); max-height:100%; padding:20px 14px 25px; }
  #pages.two-pages .page-sheet:first-child { padding-left:24px; padding-right:13px; border-radius:13px 2px 3px 12px; transform:rotateY(2.1deg); transform-origin:right center; background:linear-gradient(90deg,#f5f3ee 0%,#fffdfa 5%,#fffdfa 83%,#f2f0ea 100%); box-shadow:-2px 4px 0 #e3e2de,-5px 8px 0 #f9f8f5,-8px 13px 19px rgba(37,48,55,.12),-16px 25px 35px rgba(37,48,55,.12); }
  #pages.two-pages .page-sheet:last-child { padding-left:13px; padding-right:24px; border-radius:2px 13px 12px 3px; transform:rotateY(-2.1deg); transform-origin:left center; background:linear-gradient(90deg,#f0eee8 0%,#fffdfa 17%,#fffdfa 95%,#f5f3ee 100%); box-shadow:2px 4px 0 #e3e2de,5px 8px 0 #f9f8f5,8px 13px 19px rgba(37,48,55,.12),16px 25px 35px rgba(37,48,55,.12); }
  #pages.two-pages .page-sheet:first-child::after,#pages.two-pages .page-sheet:last-child::after { content:""; position:absolute;top:0;bottom:0;width:20px;pointer-events:none;opacity:.8; }
  #pages.two-pages .page-sheet:first-child::after {right:0;background:linear-gradient(90deg,transparent,rgba(45,45,38,.095));}
  #pages.two-pages .page-sheet:last-child::after {left:0;background:linear-gradient(90deg,rgba(45,45,38,.105),transparent);}
  #pages:not(.two-pages) .page-sheet { padding:20px 22px 25px; height:min(calc(100dvh - var(--top) - var(--bottom) - 74px),72vw); border-radius:9px; box-shadow:0 5px 0 #e5e4e0,0 12px 0 #f8f7f4,0 24px 32px rgba(37,48,55,.18); }
  #pages .page { max-height:calc(100dvh - var(--top) - var(--bottom) - 119px)!important; }
}
#readerFooter {justify-content:center;gap:clamp(14px,2vw,24px);}
#progressSlider {flex:0 1 230px;width:min(24vw,230px);min-width:95px;}
@media(max-width:899px) {
  #book {padding:7px 8px;}
  #pages .page-sheet {padding:7px;max-width:100%;max-height:100%;box-shadow:0 4px 0 #e5e4e1,0 12px 22px rgba(37,48,55,.12);border-radius:4px;}
  #pages .page {max-height:calc(100dvh - var(--top) - var(--bottom) - 28px);max-width:100%;}
  #readerFooter {gap:15px;}
  #progressSlider {flex:1 1 auto;width:auto;min-width:70px;max-width:200px;}
}

</style>

    document.getElementById("pageUI");

  const indicatorElement =
    document.getElementById("pageIndicator");

  const leftArrow =
    document.getElementById("leftArrow");

  const rightArrow =
    document.getElementById("rightArrow");

  const prevZone =
    document.getElementById("prevZone");

  const centerZone =
    document.getElementById("centerZone");

  const nextZone =
    document.getElementById("nextZone");

  const audioUI =
    document.getElementById("audioUI");

  const audioLeft =
    document.getElementById("audioLeft");

  const audioRight =
    document.getElementById("audioRight");

  const backToCover =
    document.getElementById("backToCover");




  /* ========================================
     MODE
  ======================================== */


  function isDesktop() {

    return (
      window.innerWidth
      >=
      DESKTOP_BREAKPOINT
    );

  }



  /* ========================================
     FILE NAMES
  ======================================== */


  function pageFile(pageNumber) {

    return (
      String(pageNumber)
        .padStart(2, "0")
      +
      ".jpg"
    );

  }





  /* ========================================
     AUDIOBOOK TTS
  ======================================== */

  function audiobookText(pageNumber) {
    const page = AUDIOBOOK_PAGES[pageNumber];
    return page ? page.lines.join("\n") : null;
  }

  async function fetchPageAudio(pageNumber) {
    if (audioCache.has(pageNumber)) {
      return audioCache.get(pageNumber);
    }

    const text = audiobookText(pageNumber);
    if (!text) throw new Error("No audiobook text for this page.");

    const response = await fetch(TTS_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        passageId: "arekore-p" + String(pageNumber).padStart(2, "0"),
        clips: [{ clipId: "full", kind: "full", text }]
      })
    });

    if (!response.ok) {
      throw new Error("TTS request failed: " + response.status);
    }

    const data = await response.json();
    if (!data.clips || !data.clips.length) {
      throw new Error("No audio returned.");
    }

    const clip = data.clips[0];
    const base64 = clip.audioBase64 || clip.audio || clip.base64;
    if (!base64) throw new Error("Audio data missing.");

    const mimeType = data.mimeType || clip.mimeType || "audio/mpeg";
    const audioURL = "data:" + mimeType + ";base64," + base64;
    audioCache.set(pageNumber, audioURL);
    return audioURL;
  }

  function resetAudioButton() {
    if (activeAudioButton) activeAudioButton.textContent = "▶";
  }

  function stopAudio() {
    if (activeAudio) {
      activeAudio.pause();
      activeAudio.currentTime = 0;
    }
    resetAudioButton();
    activeAudio = null;
    activeAudioPage = null;
    activeAudioButton = null;
  }

  async function togglePageAudio(pageNumber, button) {
    if (activeAudio && activeAudioPage === pageNumber) {
      if (!activeAudio.paused) {
        activeAudio.pause();
        button.textContent = "▶";
        return;
      }
      await activeAudio.play();
      button.textContent = "Ⅱ";
      return;
    }

    stopAudio();
    button.textContent = "…";

    try {
      const audioURL = await fetchPageAudio(pageNumber);
      const audio = new Audio(audioURL);
      activeAudio = audio;
      activeAudioPage = pageNumber;
      activeAudioButton = button;

      audio.addEventListener("ended", () => {
        button.textContent = "▶";
        activeAudio = null;
        activeAudioPage = null;
        activeAudioButton = null;
      }, { once: true });

      await audio.play();
      button.textContent = "Ⅱ";
    } catch (error) {
      console.error("Audiobook error:", error);
      button.textContent = "▶";
      alert("音声を再生できませんでした。");
    }
  }

  function updateAudioControls(visiblePages) {
    audioLeft.style.display = "none";
    audioRight.style.display = "none";
    audioLeft.onclick = null;
    audioRight.onclick = null;

    if (!visiblePages.some(pageNumber => AUDIOBOOK_PAGES[pageNumber])) {
      audioUI.classList.remove("visible");
      return;
    }

    if (visiblePages.length === 1) {
      const pageNumber = visiblePages[0];
      if (!AUDIOBOOK_PAGES[pageNumber]) return;
      audioLeft.style.display = "block";
      audioLeft.onclick = event => {
        event.stopPropagation();
        togglePageAudio(pageNumber, audioLeft);
      };
      return;
    }

    const leftPage = visiblePages[0];
    const rightPage = visiblePages[1];

    if (AUDIOBOOK_PAGES[leftPage]) {
      audioLeft.style.display = "block";
      audioLeft.onclick = event => {
        event.stopPropagation();
        togglePageAudio(leftPage, audioLeft);
      };
    }

    if (AUDIOBOOK_PAGES[rightPage]) {
      audioRight.style.display = "block";
      audioRight.onclick = event => {
        event.stopPropagation();
        togglePageAudio(rightPage, audioRight);
      };
    }
  }


  /* ========================================
     VISIBLE PAGES
  ======================================== */


  function getVisiblePages() {


    /* MOBILE */

    if (!isDesktop()) {

      return [
        currentPage
      ];

    }


    /* FRONT COVER */

    if (
      currentPage <= 1
    ) {

      return [1];

    }


    /* BACK COVER */

    if (
      currentPage >= TOTAL_PAGES
    ) {

      return [
        TOTAL_PAGES
      ];

    }


    /* SPREAD */

    let leftPage;


    if (
      currentPage % 2 === 0
    ) {

      leftPage =
        currentPage;

    }

    else {

      leftPage =
        currentPage - 1;

    }


    const rightPage =
      leftPage + 1;


    if (
      rightPage >= TOTAL_PAGES
    ) {

      return [
        TOTAL_PAGES
      ];

    }


    return [
      leftPage,
      rightPage
    ];

  }



  /* ========================================
     CREATE PAGE IMAGE
  ======================================== */


  function createPageImage(
    pageNumber
  ) {

    const img =
      document.createElement(
        "img"
      );


    img.className =
      "page";


    img.src =
      pageFile(
        pageNumber
      );


    img.alt =
      "あれこれ "
      +
      pageNumber;


    img.draggable =
      false;


    return img;

  }



  /* ========================================
     RENDER
  ======================================== */


  function render() {

    stopAudio();

    const visiblePages =
      getVisiblePages();


    pagesElement.innerHTML =
      "";


    pagesElement
      .classList
      .toggle(
        "two-pages",
        visiblePages.length === 2
      );


    visiblePages.forEach(
      pageNumber => {

        const img =
          createPageImage(
            pageNumber
          );

        img.addEventListener(
          "load",
          positionArrows,
          { once: true }
        );

        const sheet = document.createElement("div");
        sheet.className = "page-sheet";
        sheet.appendChild(img);
        pagesElement.appendChild(sheet);

      }
    );

    requestAnimationFrame(
      positionArrows
    );


    updateIndicator(
      visiblePages
    );
    updateProgress(visiblePages);


    updateAudioControls(
      visiblePages
    );
    audioUI.classList.toggle("visible", visiblePages.some(n => AUDIOBOOK_PAGES[n]));


    backToCover
      .classList
      .toggle(
        "visible",
        visiblePages.length === 1
        &&
        visiblePages[0] === TOTAL_PAGES
      );


    updateArrowAvailability();


    preloadNearbyPages(
      visiblePages
    );


    loadingElement
      .classList
      .add(
        "hidden"
      );

  }



  /* ========================================
     PAGE NUMBER
  ======================================== */


  function updateIndicator(
    visiblePages
  ) {


    if (
      visiblePages.length === 1
    ) {

      indicatorElement.textContent =
        visiblePages[0]
        +
        " / "
        +
        TOTAL_PAGES;

    }

    else {

      indicatorElement.textContent =
        visiblePages[0]
        +
        "–"
        +
        visiblePages[1]
        +
        " / "
        +
        TOTAL_PAGES;

    }

  }



  /* ========================================
     ARROW POSITION
  ======================================== */


  function positionArrows() {

    const visibleImages =
      pagesElement.querySelectorAll(".page");

    if (!visibleImages.length) {
      return;
    }

    const firstRect =
      visibleImages[0].getBoundingClientRect();

    const lastRect =
      visibleImages[visibleImages.length - 1].getBoundingClientRect();

    const bookLeft = firstRect.left;
    const bookRight = lastRect.right;
    const bookWidth = Math.max(1, bookRight - bookLeft);

    const arrowWidth =
      isDesktop() ? 72 : 52;

    if (isDesktop()) {

      const arrowGap = 20;
      const edgeZone = 92;

      leftArrow.style.left =
        Math.max(
          4,
          bookLeft - arrowWidth - arrowGap
        ) + "px";

      rightArrow.style.left =
        Math.min(
          window.innerWidth - arrowWidth - 4,
          bookRight + arrowGap
        ) + "px";

      const leftHitStart =
        Math.max(
          0,
          bookLeft - arrowWidth - arrowGap - 12
        );

      const leftHitEnd =
        Math.min(
          window.innerWidth,
          bookLeft + 44
        );

      prevZone.style.left =
        leftHitStart + "px";
      prevZone.style.right = "auto";
      prevZone.style.width =
        Math.max(1, leftHitEnd - leftHitStart) + "px";

      const rightHitStart =
        Math.max(
          0,
          bookRight - 44
        );

      const rightHitEnd =
        Math.min(
          window.innerWidth,
          bookRight + arrowGap + arrowWidth + 12
        );

      nextZone.style.left =
        rightHitStart + "px";
      nextZone.style.right = "auto";
      nextZone.style.width =
        Math.max(1, rightHitEnd - rightHitStart) + "px";

      centerZone.style.left =
        (bookLeft + bookWidth * 0.28) + "px";
      centerZone.style.right = "auto";
      centerZone.style.width =
        (bookWidth * 0.44) + "px";

    } else {

      const inset = 14;

      leftArrow.style.left =
        Math.max(
          0,
          bookLeft + inset
        ) + "px";

      rightArrow.style.left =
        Math.min(
          window.innerWidth - arrowWidth,
          bookRight - arrowWidth - inset
        ) + "px";

      prevZone.style.left = "0px";
      prevZone.style.right = "auto";
      prevZone.style.width = "28%";

      centerZone.style.left = "28%";
      centerZone.style.right = "auto";
      centerZone.style.width = "44%";

      nextZone.style.left = "72%";
      nextZone.style.right = "auto";
      nextZone.style.width = "28%";
    }

    leftArrow.style.right = "auto";
    rightArrow.style.right = "auto";

  }



  /* ========================================
     ARROW AVAILABILITY
  ======================================== */


  function updateArrowAvailability() {

    const atStart =
      currentPage <= 1;


    const atEnd =
      currentPage >= TOTAL_PAGES;


    prevZone.style.display =
      atStart
      ?
      "none"
      :
      "block";


    nextZone.style.display =
      atEnd
      ?
      "none"
      :
      "block";


    if (atStart) {

      leftArrow
        .classList
        .remove(
          "visible"
        );

    }


    if (atEnd) {

      rightArrow
        .classList
        .remove(
          "visible"
        );

    }

  }



  /* ========================================
     NEXT PAGE
  ======================================== */


  function nextPage() {


    if (
      currentPage
      >=
      TOTAL_PAGES
    ) {

      return;

    }


    /* MOBILE */

    if (!isDesktop()) {

      currentPage++;

      render();

      setTimeout(
        showMobileTurnHint,
        40
      );

      return;

    }


    /* COVER → 02 + 03 */

    if (
      currentPage === 1
    ) {

      currentPage = 2;

      render();

      return;

    }


    const visiblePages =
      getVisiblePages();


    const lastVisiblePage =
      visiblePages[
        visiblePages.length - 1
      ];


    /* LAST SPREAD → BACK COVER */

    if (
      lastVisiblePage >= 59
    ) {

      currentPage =
        TOTAL_PAGES;

    }

    else {

      currentPage =
        lastVisiblePage + 1;

    }


    render();

  }



  /* ========================================
     PREVIOUS PAGE
  ======================================== */


  function previousPage() {


    if (
      currentPage <= 1
    ) {

      return;

    }


    /* MOBILE */

    if (!isDesktop()) {

      currentPage--;

      render();

      setTimeout(
        showMobileTurnHint,
        40
      );

      return;

    }


    /* BACK COVER → 58 + 59 */

    if (
      currentPage
      ===
      TOTAL_PAGES
    ) {

      currentPage = 58;

      render();

      return;

    }


    const visiblePages =
      getVisiblePages();


    const firstVisiblePage =
      visiblePages[0];


    /* 02 + 03 → COVER */

    if (
      firstVisiblePage <= 2
    ) {

      currentPage = 1;

    }

    else {

      currentPage =
        firstVisiblePage - 2;

    }


    render();

  }



  /* ========================================
     HINT UI
  ======================================== */


  function hideHints() {

    pageUI
      .classList
      .remove(
        "visible"
      );


    leftArrow
      .classList
      .remove(
        "visible"
      );


    rightArrow
      .classList
      .remove(
        "visible"
      );


    audioUI
      .classList
      .remove(
        "visible"
      );

  }



  function showHints() {

    clearTimeout(
      hintTimer
    );


    pageUI
      .classList
      .add(
        "visible"
      );


    if (
      getVisiblePages().some(
        pageNumber => AUDIOBOOK_PAGES[pageNumber]
      )
    ) {
      audioUI
        .classList
        .add(
          "visible"
        );
    }


    if (
      currentPage > 1
    ) {

      leftArrow
        .classList
        .add(
          "visible"
        );

    }


    if (
      currentPage
      <
      TOTAL_PAGES
    ) {

      rightArrow
        .classList
        .add(
          "visible"
        );

    }


    hintTimer =
      setTimeout(
        hideHints,
        HINT_DURATION
      );

  }



  function showMobileTurnHint() {

    if (isDesktop()) {
      return;
    }

    leftArrow.classList.remove("visible");
    rightArrow.classList.remove("visible");

    if (currentPage > 1) {
      leftArrow.classList.add("visible");
    }

    if (currentPage < TOTAL_PAGES) {
      rightArrow.classList.add("visible");
    }

    setTimeout(
      () => {
        if (!isDesktop()) {
          leftArrow.classList.remove("visible");
          rightArrow.classList.remove("visible");
        }
      },
      1200
    );

  }



  function toggleHints() {


    if (
      pageUI
        .classList
        .contains(
          "visible"
        )
    ) {

      clearTimeout(
        hintTimer
      );

      hideHints();

    }

    else {

      showHints();

    }

  }



  /* ========================================
     CLICK / TAP
  ======================================== */


  prevZone
    .addEventListener(
      "click",
      () => {

        previousPage();

      }
    );


  nextZone
    .addEventListener(
      "click",
      () => {

        nextPage();

      }
    );


  centerZone
    .addEventListener(
      "click",
      () => {

        toggleHints();

      }
    );



  /* ========================================
     DESKTOP HOVER
  ======================================== */


  prevZone.addEventListener(
    "mouseenter",
    () => {
      if (isDesktop() && currentPage > 1) {
        leftArrow.classList.add("visible");
      }
    }
  );

  prevZone.addEventListener(
    "mouseleave",
    () => {
      if (isDesktop()) {
        leftArrow.classList.remove("visible");
      }
    }
  );

  nextZone.addEventListener(
    "mouseenter",
    () => {
      if (isDesktop() && currentPage < TOTAL_PAGES) {
        rightArrow.classList.add("visible");
      }
    }
  );

  nextZone.addEventListener(
    "mouseleave",
    () => {
      if (isDesktop()) {
        rightArrow.classList.remove("visible");
      }
    }
  );


  backToCover.addEventListener(
    "click",
    event => {
      event.stopPropagation();
      clearTimeout(hintTimer);
      hideHints();
      currentPage = 1;
      render();
    }
  );


  /* ========================================
     KEYBOARD
  ======================================== */


  document.addEventListener(
    "keydown",
    event => {


      if (
        event.key
        ===
        "ArrowRight"
      ) {

        nextPage();

      }


      if (
        event.key
        ===
        "ArrowLeft"
      ) {

        previousPage();

      }


      if (
        event.key
        ===
        " "
      ) {

        event.preventDefault();

        toggleHints();

      }

    }
  );



  /* ========================================
     SWIPE
  ======================================== */


  document.addEventListener(
    "touchstart",
    event => {


      if (
        event.touches.length
        !==
        1
      ) {

        return;

      }


      touchStartX =
        event.touches[0]
          .clientX;


      touchStartY =
        event.touches[0]
          .clientY;

    },
    {
      passive: true
    }
  );



  document.addEventListener(
    "touchend",
    event => {


      if (
        event.changedTouches.length
        !==
        1
      ) {

        return;

      }


      const touchEndX =
        event.changedTouches[0]
          .clientX;


      const touchEndY =
        event.changedTouches[0]
          .clientY;


      const deltaX =
        touchEndX
        -
        touchStartX;


      const deltaY =
        touchEndY
        -
        touchStartY;


      /*
        Ignore small movement
        and vertical gestures.
      */

      if (
        Math.abs(deltaX) < 45
        ||
        Math.abs(deltaX)
        <
        Math.abs(deltaY)
      ) {

        return;

      }


      if (
        deltaX < 0
      ) {

        nextPage();

      }

      else {

        previousPage();

      }

    },
    {
      passive: true
    }
  );



  /* ========================================
     PRELOAD
  ======================================== */


  function preloadPage(
    pageNumber
  ) {


    if (
      pageNumber < 1
      ||
      pageNumber
      >
      TOTAL_PAGES
    ) {

      return;

    }


    const img =
      new Image();


    img.src =
      pageFile(
        pageNumber
      );

  }



  function preloadNearbyPages(
    visiblePages
  ) {


    const first =
      visiblePages[0];


    const last =
      visiblePages[
        visiblePages.length - 1
      ];


    preloadPage(
      first - 2
    );

    preloadPage(
      first - 1
    );

    preloadPage(
      last + 1
    );

    preloadPage(
      last + 2
    );

  }



  /* ========================================
     RESIZE
  ======================================== */


  let resizeTimer;


  window.addEventListener(
    "resize",
    () => {


      clearTimeout(
        resizeTimer
      );


      resizeTimer =
        setTimeout(
          () => {


            /*
              If switching into desktop
              while on an odd inner page,
              normalize to its spread.
            */

            if (
              isDesktop()
              &&
              currentPage > 1
              &&
              currentPage
              <
              TOTAL_PAGES
              &&
              currentPage % 2 !== 0
            ) {

              currentPage--;

            }


            hideHints();

            render();

            requestAnimationFrame(
              positionArrows
            );

          },
          120
        );

    }
  );




  /* Editorial reader controls: independent of the existing page/audio logic. */
  const progressSlider = document.getElementById("progressSlider");
  function updateProgress(visiblePages) {
    const first = visiblePages[0];
    progressSlider.value = String(first);
    progressSlider.style.setProperty("--progress", ((first - 1) / (TOTAL_PAGES - 1) * 100) + "%");
  }
  progressSlider.addEventListener("input", () => {
    const target = Number(progressSlider.value);
    currentPage = isDesktop() && target > 1 && target < TOTAL_PAGES && target % 2 !== 0 ? target - 1 : target;
    render();
  });
  document.getElementById("fullscreenButton").addEventListener("click", async () => {
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      else if (document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen();
    } catch (e) { console.warn("Fullscreen unavailable", e); }
  });
  document.getElementById("audioInfoButton").addEventListener("click", () => {
    if (getVisiblePages().some(n => AUDIOBOOK_PAGES[n])) {
      showHints();
    } else {
      alert("朗読は準備中です。現在は4・5ページで試験中です。");
    }
  });

  /* ========================================
     START
  ======================================== */


  render();


  /*
    First-time navigation hint.

    Mainly useful on phones:
    tells the reader that the book
    can be turned without leaving
    permanent UI on screen.
  */

  setTimeout(
    () => {

      showHints();

    },
    450
  );

</script>

</body>
