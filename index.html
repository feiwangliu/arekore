<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="theme-color" content="#151515">
  <title>あれこれ</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #151515;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Sans",
        "Yu Gothic",
        sans-serif;
    }

    body {
      touch-action: pan-y;
      overscroll-behavior: none;
    }

    /* =========================
       READER
    ========================= */

    #reader {
      position: fixed;
      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #151515;
      overflow: hidden;

      user-select: none;
      -webkit-user-select: none;
    }

    #book {
      position: relative;

      display: flex;
      align-items: center;
      justify-content: center;

      width: 100%;
      height: 100%;

      padding:
        env(safe-area-inset-top)
        env(safe-area-inset-right)
        env(safe-area-inset-bottom)
        env(safe-area-inset-left);
    }

    #pages {
      display: flex;
      align-items: center;
      justify-content: center;

      width: 100%;
      height: 100%;

      gap: 0;
    }

    .page {
      display: block;

      width: auto;
      height: auto;

      max-width: 100%;
      max-height: 100%;

      object-fit: contain;

      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;

      background: #fff;
    }

    /* =========================
       DOUBLE PAGE
    ========================= */

    body.double-page #pages {
      max-width: 100%;
      max-height: 100%;
    }

    body.double-page #pages.two-pages .page {
      max-width: 50%;
      max-height: 100%;
    }

    /* =========================
       INVISIBLE CLICK AREAS
    ========================= */

    .tap-zone {
      position: fixed;
      top: 0;
      bottom: 0;

      z-index: 10;
    }

    #prevZone {
      left: 0;
      width: 30%;
    }

    #centerZone {
      left: 30%;
      width: 40%;
    }

    #nextZone {
      right: 0;
      width: 30%;
    }

    /* =========================
       UI
    ========================= */

    #ui {
      position: fixed;
      left: 50%;
      bottom:
        calc(18px + env(safe-area-inset-bottom));

      transform: translateX(-50%);

      display: flex;
      align-items: center;
      gap: 14px;

      padding: 8px 14px;

      border-radius: 999px;

      background: rgba(20, 20, 20, 0.72);
      color: white;

      font-size: 13px;

      z-index: 30;

      opacity: 0;
      pointer-events: none;

      transition: opacity 180ms ease;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    #ui.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .ui-button {
      appearance: none;
      border: 0;
      background: transparent;
      color: white;

      font-size: 22px;
      line-height: 1;

      padding: 4px 8px;

      cursor: pointer;
    }

    #pageIndicator {
      min-width: 72px;
      text-align: center;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    /* =========================
       LOADING
    ========================= */

    #loading {
      position: fixed;
      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      color: rgba(255,255,255,.55);
      font-size: 12px;
      letter-spacing: .08em;

      pointer-events: none;
      z-index: 2;
    }

    #loading.hidden {
      display: none;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 767px) {
      #book {
        padding: 0;
      }

      .page {
        max-width: 100vw;
        max-height: 100dvh;
      }
    }

  </style>
</head>

<body>

  <main id="reader">

    <div id="loading">
      loading…
    </div>

    <div id="book">
      <div id="pages"></div>
    </div>

  </main>


  <!-- Invisible navigation -->
  <div id="prevZone" class="tap-zone"></div>
  <div id="centerZone" class="tap-zone"></div>
  <div id="nextZone" class="tap-zone"></div>


  <!-- Minimal UI -->
  <div id="ui">

    <button
      id="prevButton"
      class="ui-button"
      aria-label="Previous page">
      ‹
    </button>

    <div id="pageIndicator">
      1 / 60
    </div>

    <button
      id="nextButton"
      class="ui-button"
      aria-label="Next page">
      ›
    </button>

  </div>


<script>

  /* ==========================================
     あれこれ
     Digital Edition
     First Edition · 2026
  ========================================== */

  const TOTAL_PAGES = 60;

  /*
    Image files:

    01.jpg
    02.jpg
    ...
    60.jpg

    Future audio can use:

    audio/01.mp3
    audio/02.mp3
    ...
  */


  const pagesElement =
    document.getElementById("pages");

  const loadingElement =
    document.getElementById("loading");

  const uiElement =
    document.getElementById("ui");

  const indicatorElement =
    document.getElementById("pageIndicator");


  let currentPage = 1;

  let uiTimer = null;

  let touchStartX = 0;
  let touchStartY = 0;

  let touchEndX = 0;
  let touchEndY = 0;


  /* ==========================================
     DEVICE / LAYOUT
  ========================================== */

  function isDoublePageMode() {

    /*
      Mobile:
      always single page.

      Larger screens:
      double page only when landscape.
    */

    return (
      window.innerWidth >= 768 &&
      window.innerWidth > window.innerHeight
    );
  }


  /*
    Spread logic:

    01 = cover alone

    02 + 03
    04 + 05
    06 + 07
    ...

    58 + 59

    60 = back cover alone
  */

  function getVisiblePages() {

    if (!isDoublePageMode()) {
      return [currentPage];
    }


    /* Cover */

    if (currentPage === 1) {
      return [1];
    }


    /* Back cover */

    if (currentPage === TOTAL_PAGES) {
      return [TOTAL_PAGES];
    }


    /*
      If current page is odd,
      go back to previous even page.
    */

    let leftPage =
      currentPage % 2 === 0
        ? currentPage
        : currentPage - 1;


    let rightPage =
      leftPage + 1;


    if (rightPage >= TOTAL_PAGES) {
      return [TOTAL_PAGES];
    }


    return [
      leftPage,
      rightPage
    ];
  }


  /* ==========================================
     IMAGE
  ========================================== */

  function pageFile(pageNumber) {

    return (
      String(pageNumber).padStart(2, "0")
      + ".jpg"
    );
  }


  function createPageImage(pageNumber) {

    const img =
      document.createElement("img");

    img.className = "page";

    img.src =
      pageFile(pageNumber);

    img.alt =
      "あれこれ " + pageNumber;

    img.draggable = false;

    return img;
  }


  /* ==========================================
     RENDER
  ========================================== */

  function render() {

    const visiblePages =
      getVisiblePages();


    document.body.classList.toggle(
      "double-page",
      isDoublePageMode()
    );


    pagesElement.classList.toggle(
      "two-pages",
      visiblePages.length === 2
    );


    pagesElement.innerHTML = "";


    visiblePages.forEach(pageNumber => {

      const img =
        createPageImage(pageNumber);

      pagesElement.appendChild(img);

    });


    updateIndicator(
      visiblePages
    );


    preloadNearbyPages(
      visiblePages
    );


    loadingElement.classList.add(
      "hidden"
    );

  }


  /* ==========================================
     PAGE INDICATOR
  ========================================== */

  function updateIndicator(visiblePages) {

    if (visiblePages.length === 1) {

      indicatorElement.textContent =
        visiblePages[0]
        + " / "
        + TOTAL_PAGES;

    } else {

      indicatorElement.textContent =
        visiblePages[0]
        + "–"
        + visiblePages[1]
        + " / "
        + TOTAL_PAGES;

    }

  }


  /* ==========================================
     NAVIGATION
  ========================================== */

  function nextPage() {

    if (currentPage >= TOTAL_PAGES) {
      return;
    }


    if (isDoublePageMode()) {

      if (currentPage === 1) {

        currentPage = 2;

      } else {

        const visible =
          getVisiblePages();

        currentPage =
          Math.min(
            visible[visible.length - 1] + 1,
            TOTAL_PAGES
          );

      }

    } else {

      currentPage++;

    }


    render();

  }


  function previousPage() {

    if (currentPage <= 1) {
      return;
    }


    if (isDoublePageMode()) {

      const visible =
        getVisiblePages();


      if (visible[0] <= 2) {

        currentPage = 1;

      } else if (
        currentPage === TOTAL_PAGES
      ) {

        currentPage =
          TOTAL_PAGES - 2;

      } else {

        currentPage =
          Math.max(
            visible[0] - 2,
            1
          );

      }

    } else {

      currentPage--;

    }


    render();

  }


  /* ==========================================
     UI
  ========================================== */

  function showUI() {

    uiElement.classList.add(
      "visible"
    );


    clearTimeout(
      uiTimer
    );


    uiTimer =
      setTimeout(() => {

        uiElement.classList.remove(
          "visible"
        );

      }, 2600);

  }


  function toggleUI() {

    if (
      uiElement.classList.contains(
        "visible"
      )
    ) {

      uiElement.classList.remove(
        "visible"
      );

      clearTimeout(
        uiTimer
      );

    } else {

      showUI();

    }

  }


  /* ==========================================
     CLICK / TAP
  ========================================== */

  document
    .getElementById("prevZone")
    .addEventListener(
      "click",
      previousPage
    );


  document
    .getElementById("nextZone")
    .addEventListener(
      "click",
      nextPage
    );


  document
    .getElementById("centerZone")
    .addEventListener(
      "click",
      toggleUI
    );


  document
    .getElementById("prevButton")
    .addEventListener(
      "click",
      event => {

        event.stopPropagation();

        previousPage();

        showUI();

      }
    );


  document
    .getElementById("nextButton")
    .addEventListener(
      "click",
      event => {

        event.stopPropagation();

        nextPage();

        showUI();

      }
    );


  /* ==========================================
     KEYBOARD
  ========================================== */

  document.addEventListener(
    "keydown",
    event => {

      if (
        event.key === "ArrowRight"
      ) {

        nextPage();

      }


      if (
        event.key === "ArrowLeft"
      ) {

        previousPage();

      }

    }
  );


  /* ==========================================
     SWIPE
  ========================================== */

  document.addEventListener(
    "touchstart",
    event => {

      if (
        event.touches.length !== 1
      ) {
        return;
      }


      touchStartX =
        event.touches[0].clientX;

      touchStartY =
        event.touches[0].clientY;

    },
    {
      passive: true
    }
  );


  document.addEventListener(
    "touchend",
    event => {

      if (
        event.changedTouches.length !== 1
      ) {
        return;
      }


      touchEndX =
        event.changedTouches[0].clientX;

      touchEndY =
        event.changedTouches[0].clientY;


      const deltaX =
        touchEndX - touchStartX;

      const deltaY =
        touchEndY - touchStartY;


      /*
        Ignore small movement
        and mostly vertical gestures.
      */

      if (
        Math.abs(deltaX) < 45 ||
        Math.abs(deltaX) <
        Math.abs(deltaY)
      ) {
        return;
      }


      if (deltaX < 0) {

        nextPage();

      } else {

        previousPage();

      }

    },
    {
      passive: true
    }
  );


  /* ==========================================
     PRELOAD
  ========================================== */

  function preloadPage(pageNumber) {

    if (
      pageNumber < 1 ||
      pageNumber > TOTAL_PAGES
    ) {
      return;
    }


    const img =
      new Image();

    img.src =
      pageFile(pageNumber);

  }


  function preloadNearbyPages(
    visiblePages
  ) {

    const first =
      visiblePages[0];

    const last =
      visiblePages[
        visiblePages.length - 1
      ];


    preloadPage(
      first - 2
    );

    preloadPage(
      first - 1
    );

    preloadPage(
      last + 1
    );

    preloadPage(
      last + 2
    );

  }


  /* ==========================================
     RESIZE / ROTATION
  ========================================== */

  let resizeTimer;


  window.addEventListener(
    "resize",
    () => {

      clearTimeout(
        resizeTimer
      );


      resizeTimer =
        setTimeout(
          render,
          120
        );

    }
  );


  /* ==========================================
     START
  ========================================== */

  render();

</script>

</body>
</html>
