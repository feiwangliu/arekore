<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f4ee">

  <title>あれこれ</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    body {
      background: #f7f4ee;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Sans",
        "Yu Gothic",
        sans-serif;
      color: #333;
    }

    main {
      width: 100%;
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .book-start {
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(42px, 10vw, 82px);
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .edition {
      margin-top: 18px;
      font-size: 12px;
      letter-spacing: 0.12em;
      color: #888;
    }
  </style>
</head>

<body>
  <main>
    <div class="book-start">
      <h1>あれこれ</h1>
      <div class="edition">First Edition · 2026</div>
    </div>
  </main>
</body>
</html>
